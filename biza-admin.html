<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biza Pizza — Admin Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#C8282A;--dark:#120A06;--cream:#F5EDD8;--gold:#B8860B;
  --slate:#1C0E08;--muted:#888;--bg:#F0EAD9;--white:#fff;
  --sans:'DM Sans',system-ui,sans-serif;--serif:'DM Serif Display',Georgia,serif;
}
body{font-family:var(--sans);background:var(--bg);color:#1a1a1a;min-height:100vh;}

/* ── PIN SCREEN ── */
#pinScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--dark);}
.pin-box{background:var(--slate);border:1px solid rgba(200,40,42,.2);border-radius:20px;padding:52px 44px;width:min(90vw,380px);text-align:center;}
.pin-logo{font-family:var(--serif);font-size:2.2rem;color:var(--cream);margin-bottom:4px;}
.pin-sub{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,237,216,.35);margin-bottom:36px;}
.pin-display{font-size:2.4rem;letter-spacing:16px;height:56px;margin-bottom:24px;color:var(--cream);user-select:none;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.pin-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:18px;font-size:1.3rem;font-family:var(--sans);color:var(--cream);cursor:pointer;transition:background .15s,border-color .15s;}
.pin-btn:hover{background:rgba(200,40,42,.15);border-color:var(--red);}
.pin-btn.wide{grid-column:span 2;}
.pin-enter{background:var(--red);color:#fff;border:none;border-radius:12px;padding:18px;width:100%;font-size:1rem;font-weight:700;font-family:var(--sans);cursor:pointer;letter-spacing:.06em;transition:background .2s;}
.pin-enter:hover{background:#a81f21;}
.pin-error{color:#e74c3c;font-size:.85rem;margin-top:12px;height:20px;}

/* ── MAIN LAYOUT ── */
#adminApp{display:none;min-height:100vh;flex-direction:row;}
/* SIDEBAR */
.sidebar{width:240px;background:var(--dark);min-height:100vh;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-logo{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,.07);}
.sidebar-logo-name{font-family:var(--serif);font-size:1.4rem;color:var(--cream);}
.sidebar-logo-sub{font-size:.72rem;color:rgba(255,255,255,.3);letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}
.sidebar-nav{padding:16px 12px;flex:1;}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;font-size:.88rem;font-weight:500;color:rgba(255,255,255,.55);cursor:pointer;transition:all .2s;margin-bottom:4px;border:none;background:none;width:100%;text-align:left;font-family:var(--sans);}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--cream);}
.nav-item.active{background:rgba(200,40,42,.18);color:var(--red);font-weight:600;}
.nav-item .nav-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0;}
.sidebar-footer{padding:16px 12px;border-top:1px solid rgba(255,255,255,.07);}
.logout-btn{display:flex;align-items:center;gap:10px;padding:10px 14px;color:rgba(255,255,255,.35);font-size:.82rem;cursor:pointer;border-radius:8px;transition:all .2s;border:none;background:none;font-family:var(--sans);width:100%;}
.logout-btn:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.65);}
/* MAIN CONTENT */
.main-content{flex:1;overflow-y:auto;min-height:100vh;}
.top-bar{background:var(--white);border-bottom:1px solid rgba(0,0,0,.08);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.top-bar-title{font-family:var(--serif);font-size:1.5rem;color:var(--dark);}
.top-bar-date{font-size:.82rem;color:var(--muted);}
.content-body{padding:28px;}

/* ── CARDS & COMPONENTS ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.kpi-card{background:var(--white);border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-top:3px solid var(--red);}
.kpi-label{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#aaa;margin-bottom:8px;}
.kpi-val{font-family:var(--serif);font-size:2.2rem;color:var(--dark);line-height:1;}
.kpi-sub{font-size:.75rem;color:#bbb;margin-top:4px;}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px;}
.card{background:var(--white);border-radius:14px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:20px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.card-title{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#aaa;font-weight:700;}
.add-btn{background:var(--dark);color:var(--cream);border:none;padding:7px 16px;border-radius:8px;font-size:.8rem;cursor:pointer;font-family:var(--sans);transition:background .2s;}
.add-btn:hover{background:var(--red);}
.btn-sm{background:var(--red);color:#fff;border:none;padding:6px 14px;border-radius:7px;font-size:.78rem;cursor:pointer;font-family:var(--sans);transition:background .2s;}
.btn-sm:hover{background:#a81f21;}
.btn-outline{background:transparent;color:var(--dark);border:1.5px solid rgba(0,0,0,.12);padding:6px 14px;border-radius:7px;font-size:.78rem;cursor:pointer;font-family:var(--sans);transition:all .2s;}
.btn-outline:hover{border-color:var(--red);color:var(--red);}
/* TABLE */
table{width:100%;border-collapse:collapse;}
th{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#aaa;text-align:left;padding:8px 12px;border-bottom:2px solid #f0ead9;}
td{padding:10px 12px;border-bottom:1px solid #f9f7f3;font-size:.88rem;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(200,40,42,.03);}
/* STATUS BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.04em;}
.badge-new{background:#fee2e2;color:#991b1b;}
.badge-making{background:#fef3c7;color:#92400e;}
.badge-ready{background:#dcfce7;color:#166534;}
.badge-done{background:#f3f4f6;color:#6b7280;}
/* BAR CHART */
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding:0 4px;}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar{width:100%;background:var(--red);border-radius:4px 4px 0 0;transition:height .6s ease;opacity:.85;}
.bar-label{font-size:.72rem;color:#aaa;white-space:nowrap;}
.bar-val{font-size:.7rem;color:var(--dark);font-weight:600;}
/* TOP ITEMS */
.top-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0ead9;}
.top-item:last-child{border-bottom:none;}
.top-rank{font-family:var(--serif);font-size:1.3rem;color:rgba(200,40,42,.3);width:28px;flex-shrink:0;}
.top-name{font-size:.9rem;font-weight:500;color:var(--dark);}
.top-count{font-size:.8rem;color:var(--muted);margin-left:auto;}
/* FILTER TABS */
.filter-tabs{display:flex;gap:8px;margin-bottom:20px;}
.filter-tab{padding:8px 18px;border-radius:50px;font-size:.82rem;font-weight:500;cursor:pointer;border:1.5px solid rgba(0,0,0,.1);background:transparent;color:#777;font-family:var(--sans);transition:all .2s;}
.filter-tab.active{background:var(--red);border-color:var(--red);color:#fff;}
.filter-tab:hover:not(.active){border-color:var(--red);color:var(--red);}
/* MENU GRID */
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.menu-item-card{background:var(--white);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:transform .2s;}
.menu-item-card:hover{transform:translateY(-2px);}
.menu-item-img{width:100%;height:140px;object-fit:cover;display:block;}
.menu-item-body{padding:14px;}
.menu-item-name{font-weight:700;font-size:.95rem;color:var(--dark);margin-bottom:2px;}
.menu-item-cat{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.menu-item-price{font-family:var(--serif);font-size:1.2rem;color:var(--red);margin-bottom:10px;}
.menu-item-footer{display:flex;align-items:center;justify-content:space-between;}
/* TOGGLE */
.toggle{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:24px;transition:.3s;}
.toggle-slider:before{position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s;}
.toggle input:checked + .toggle-slider{background:var(--red);}
.toggle input:checked + .toggle-slider:before{transform:translateX(18px);}
.disabled-label{font-size:.72rem;color:#aaa;}
/* FORM */
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:.78rem;font-weight:600;color:#555;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.form-input{width:100%;padding:11px 14px;border:1.5px solid rgba(0,0,0,.1);border-radius:10px;font-size:.9rem;font-family:var(--sans);color:var(--dark);background:#fff;transition:border-color .2s;}
.form-input:focus{outline:none;border-color:var(--red);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.save-btn{background:var(--red);color:#fff;border:none;padding:12px 28px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:var(--sans);transition:background .2s;}
.save-btn:hover{background:#a81f21;}
/* TOAST */
#toast{position:fixed;bottom:28px;right:28px;background:var(--dark);color:var(--cream);padding:14px 22px;border-radius:12px;font-size:.88rem;font-weight:500;z-index:9999;border-left:3px solid var(--red);transform:translateY(80px);opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}
#toast.show{transform:translateY(0);opacity:1;}
/* MODAL */
#editModal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:24px;}
#editModal.open{display:flex;}
.modal-box{background:var(--white);border-radius:20px;padding:32px;max-width:440px;width:100%;}
.modal-title{font-family:var(--serif);font-size:1.4rem;color:var(--dark);margin-bottom:20px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
/* SETTINGS */
.settings-section{margin-bottom:28px;}
.settings-title{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#aaa;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #e8e3d5;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0ead9;}
.settings-row:last-child{border-bottom:none;}
.settings-row-label{font-size:.9rem;color:var(--dark);font-weight:500;}
.settings-row-sub{font-size:.78rem;color:var(--muted);margin-top:2px;}
.pin-obscured{font-size:1rem;letter-spacing:6px;color:#aaa;}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.menu-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.sidebar{display:none}.menu-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pinScreen">
  <div class="pin-box">
    <div class="pin-logo">🍕 Biza Pizza</div>
    <div class="pin-sub">Admin Portal</div>
    <div class="pin-display" id="pinDisplay">· · · ·</div>
    <div class="pin-grid">
      <button class="pin-btn" onclick="addPin('1')">1</button>
      <button class="pin-btn" onclick="addPin('2')">2</button>
      <button class="pin-btn" onclick="addPin('3')">3</button>
      <button class="pin-btn" onclick="addPin('4')">4</button>
      <button class="pin-btn" onclick="addPin('5')">5</button>
      <button class="pin-btn" onclick="addPin('6')">6</button>
      <button class="pin-btn" onclick="addPin('7')">7</button>
      <button class="pin-btn" onclick="addPin('8')">8</button>
      <button class="pin-btn" onclick="addPin('9')">9</button>
      <button class="pin-btn wide" onclick="clearPin()">Clear</button>
      <button class="pin-btn" onclick="addPin('0')">0</button>
    </div>
    <button class="pin-enter" onclick="checkPin()">ENTER →</button>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-name">Biza Pizza</div>
      <div class="sidebar-logo-sub">Admin Portal</div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" onclick="showView('dashboard')"><span class="nav-icon">📊</span> Dashboard</button>
      <button class="nav-item" onclick="showView('orders')"><span class="nav-icon">🧾</span> Orders</button>
      <button class="nav-item" onclick="showView('menu')"><span class="nav-icon">🍕</span> Menu</button>
      <button class="nav-item" onclick="showView('editor')"><span class="nav-icon">✏️</span> Website Editor</button>
      <button class="nav-item" onclick="showView('settings')"><span class="nav-icon">⚙️</span> Settings</button>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">← Log Out</button>
    </div>
  </aside>
  <!-- MAIN -->
  <div class="main-content">
    <div class="top-bar">
      <div class="top-bar-title" id="viewTitle">Dashboard</div>
      <div class="top-bar-date" id="topBarDate"></div>
    </div>
    <div class="content-body" id="contentBody"></div>
  </div>
</div>

<!-- EDIT MENU ITEM MODAL -->
<div id="editModal">
  <div class="modal-box">
    <div class="modal-title">Edit Menu Item</div>
    <div class="form-group">
      <label class="form-label">Item Name</label>
      <input class="form-input" id="editName" type="text">
    </div>
    <div class="form-group">
      <label class="form-label">Price</label>
      <input class="form-input" id="editPrice" type="text">
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-input" id="editDesc" rows="3"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn-sm" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div id="toast">Changes saved!</div>

<script>
/* ── PIN ── */
let pin = '';
const ADMIN_PIN = '1234';
function addPin(d) { if(pin.length<4){pin+=d;updatePinDisplay();} }
function clearPin() { pin='';updatePinDisplay();document.getElementById('pinError').textContent=''; }
function updatePinDisplay() {
  const d=document.getElementById('pinDisplay');
  if(!pin.length){d.textContent='· · · ·';return;}
  d.textContent='● '.repeat(pin.length).trim()+(pin.length<4?' '+'· '.repeat(4-pin.length).trim():'');
}
function checkPin() {
  if(pin===ADMIN_PIN){
    document.getElementById('pinScreen').style.display='none';
    const app=document.getElementById('adminApp');
    app.style.display='flex';
    const ds=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    document.getElementById('topBarDate').textContent=ds;
    showView('dashboard');
  } else {
    document.getElementById('pinError').textContent='Incorrect PIN. Try again.';
    pin='';updatePinDisplay();
  }
}
function logout() {
  document.getElementById('pinScreen').style.display='flex';
  document.getElementById('adminApp').style.display='none';
  pin='';updatePinDisplay();
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('pinScreen').style.display==='none')return;
  if(e.key>='0'&&e.key<='9')addPin(e.key);
  if(e.key==='Enter')checkPin();
  if(e.key==='Backspace'){pin=pin.slice(0,-1);updatePinDisplay();}
});

/* ── DATA ── */
const DD_BANNER='https://doordash-static.s3.amazonaws.com/media/store/header/7239695b-1176-47ec-99d3-daa39576a3b3.jpg';
const DD_COVER=(w,h)=>`https://img.cdn4dd.com/p/fit=cover,width=${w},height=${h},format=auto,quality=92/media/restaurant/cover_square/e9466487-cae5-4354-85dc-85e14c85970f.03`;

const MENU_ITEMS = [
  { id:1, name:'Pizza Broto', price:'$33.39', category:'Pizzas', desc:'Personal pizza, 4 slices. Feeds 1–2. Choice of flavor.', img:DD_BANNER, available:true },
  { id:2, name:'Pizza Grande Frango', price:'$39.59', category:'Pizzas', desc:'Large chicken pizza. 8 slices. Feeds 2–3.', img:DD_COVER(600,400), available:true },
  { id:3, name:'Pizza Gigante', price:'$49.49', category:'Pizzas', desc:'XL pizza, 12 slices. Choice of flavor. Feeds 3–4.', img:DD_BANNER, available:true },
  { id:4, name:'Esfiha Carne (6pc)', price:'$21.69', category:'Esfihas', desc:'Traditional Brazilian meat pastries. Baked fresh.', img:DD_COVER(600,400), available:true },
  { id:5, name:'Guaraná Antártica', price:'$7.59', category:'Drinks', desc:'Classic Brazilian soda. 2L bottle.', img:DD_COVER(400,400), available:true },
  { id:6, name:'Combo Eu', price:'$28.49', category:'Combos', desc:'1 personal pizza + 1 Guaraná Antártica. Perfect solo meal.', img:DD_COVER(600,400), available:true },
];

const TODAY_ORDERS = [
  { id:2851, items:'Pizza Grande Frango × 1', total:'$39.59', status:'done', time:'6:42 PM' },
  { id:2852, items:'Esfiha Carne × 2, Guaraná × 1', total:'$50.97', status:'done', time:'6:58 PM' },
  { id:2853, items:'Pizza Gigante Calabresa × 1', total:'$49.49', status:'done', time:'7:14 PM' },
  { id:2854, items:'Combo Eu × 2', total:'$56.98', status:'ready', time:'7:31 PM' },
  { id:2855, items:'Pizza Grande × 1, Extra Cheese × 1', total:'$42.09', status:'ready', time:'7:45 PM' },
  { id:2856, items:'Pizza Broto × 1, Guaraná × 1', total:'$40.98', status:'making', time:'7:52 PM' },
  { id:2857, items:'Esfiha Carne × 1, Pizza Broto × 1', total:'$55.08', status:'making', time:'8:03 PM' },
  { id:2858, items:'Pizza Grande Frango × 2', total:'$79.18', status:'new', time:'8:11 PM' },
  { id:2859, items:'Combo Eu × 1, Extra Cheese × 1', total:'$30.99', status:'new', time:'8:19 PM' },
  { id:2860, items:'Pizza Gigante × 1, Guaraná × 2', total:'$64.67', status:'new', time:'8:24 PM' },
  { id:2861, items:'Esfiha Carne × 3', total:'$65.07', status:'new', time:'8:29 PM' },
  { id:2862, items:'Pizza Grande × 1, Stuffed Crust × 1', total:'$42.59', status:'new', time:'8:33 PM' },
];

const CHART_DATA = [
  {day:'Mon',val:8},{day:'Tue',val:11},{day:'Wed',val:9},
  {day:'Thu',val:14},{day:'Fri',val:18},{day:'Sat',val:22},{day:'Sun',val:12},
];

let editingId = null;

/* ── VIEWS ── */
function showView(view) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const titles={dashboard:'Dashboard',orders:'Orders',menu:'Menu',editor:'Website Editor',settings:'Settings'};
  document.getElementById('viewTitle').textContent=titles[view]||view;
  document.querySelectorAll('.nav-item').forEach(n=>{
    const text=n.textContent.trim().toLowerCase();
    if(text.includes(view.toLowerCase().replace('editor','website')))n.classList.add('active');
  });
  const views=['dashboard','orders','menu','editor','settings'];
  views.forEach(v=>{const b=document.querySelector(`.nav-item[onclick="showView('${v}')"]`);if(b)b.classList.toggle('active',v===view);});
  const cb=document.getElementById('contentBody');
  if(view==='dashboard')cb.innerHTML=renderDashboard();
  else if(view==='orders')cb.innerHTML=renderOrders();
  else if(view==='menu')cb.innerHTML=renderMenu();
  else if(view==='editor')cb.innerHTML=renderEditor();
  else if(view==='settings')cb.innerHTML=renderSettings();
  if(view==='menu')attachMenuToggles();
}

/* ── DASHBOARD ── */
function renderDashboard() {
  const maxVal=Math.max(...CHART_DATA.map(d=>d.val));
  const bars=CHART_DATA.map(d=>`
    <div class="bar-wrap">
      <div class="bar-val">${d.val}</div>
      <div class="bar" style="height:${Math.round(d.val/maxVal*90)}px"></div>
      <div class="bar-label">${d.day}</div>
    </div>`).join('');
  const recentOrders=TODAY_ORDERS.slice(-5).reverse().map(o=>`
    <tr>
      <td><strong>#${o.id}</strong></td>
      <td>${o.items}</td>
      <td><strong>${o.total}</strong></td>
      <td><span class="badge badge-${o.status}">${o.status.toUpperCase()}</span></td>
      <td style="color:#aaa">${o.time}</td>
    </tr>`).join('');
  return `
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Today's Orders</div><div class="kpi-val">12</div><div class="kpi-sub">↑ 3 from yesterday</div></div>
      <div class="kpi-card"><div class="kpi-label">Today's Revenue</div><div class="kpi-val">$487</div><div class="kpi-sub">.20 total</div></div>
      <div class="kpi-card"><div class="kpi-label">Avg Order</div><div class="kpi-val">$40</div><div class="kpi-sub">.60 per order</div></div>

/* ── MENU ── */
function renderMenu() {
  const cards=MENU_ITEMS.map(item=>`
    <div class="menu-item-card" id="menuCard${item.id}">
      <img class="menu-item-img" src="${item.img}" alt="${item.name}" onerror="this.style.background='#f0ead9';this.src=''">
      <div class="menu-item-body">
        <div class="menu-item-name">${item.name}</div>
        <div class="menu-item-cat">${item.category}</div>
        <div class="menu-item-price">${item.price}</div>
        <div class="menu-item-footer">
          <label class="toggle">
            <input type="checkbox" ${item.available?'checked':''} data-item-id="${item.id}" class="menu-toggle-input">
            <span class="toggle-slider"></span>
          </label>
          <span class="disabled-label" id="toggleLabel${item.id}">${item.available?'Available':'86\'d'}</span>
          <button class="btn-sm" onclick="openEdit(${item.id})">Edit</button>
        </div>
      </div>
    </div>`).join('');
  return `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div class="card-title">Menu Items (${MENU_ITEMS.length})</div>
        <button class="add-btn" onclick="showToast('Add Item form — coming in full version!')">+ Add Item</button>
      </div>
    </div>
    <div class="menu-grid">${cards}</div>`;
}

function attachMenuToggles() {
  document.querySelectorAll('.menu-toggle-input').forEach(input=>{
    input.addEventListener('change',function(){
      const id=parseInt(this.dataset.itemId);
      const item=MENU_ITEMS.find(m=>m.id===id);
      if(item){
        item.available=this.checked;
        const label=document.getElementById(`toggleLabel${id}`);
        if(label)label.textContent=item.available?'Available':'86\'d';
        showToast(`${item.name} marked as ${item.available?'available':'86\'d'}`);
      }
    });
  });
}

function openEdit(id) {
  const item=MENU_ITEMS.find(m=>m.id===id);
  if(!item)return;
  editingId=id;
  document.getElementById('editName').value=item.name;
  document.getElementById('editPrice').value=item.price;
  document.getElementById('editDesc').value=item.desc;
  document.getElementById('editModal').classList.add('open');
}
function closeModal(){ document.getElementById('editModal').classList.remove('open'); }
function saveEdit() {
  const item=MENU_ITEMS.find(m=>m.id===editingId);
  if(item){
    item.name=document.getElementById('editName').value;
    item.price=document.getElementById('editPrice').value;
    item.desc=document.getElementById('editDesc').value;
  }
  closeModal();
  showView('menu');
  showToast('Menu item updated!');
}
document.getElementById('editModal').addEventListener('click',e=>{if(e.target===document.getElementById('editModal'))closeModal();});

/* ── TOAST ── */
let toastTimer;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg||'Changes saved!';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}
