<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biza Pizza — Admin Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#C8282A; --dark:#0D0602; --slate:#1A0B06;
  --card:#1C0E08; --border:rgba(255,255,255,.08);
  --muted:rgba(255,255,255,.38); --dim:rgba(255,255,255,.18);
  --cream:#F5EDD8; --amber:#F59E0B; --green:#10B981; --blue:#3B82F6;
  --sans:'DM Sans',system-ui,sans-serif;
}
html,body{height:100%;background:var(--dark);color:var(--cream);font-family:var(--sans);}
body{overflow:hidden;}

/* ── PIN ── */
#pinScreen{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--dark);}
.pin-box{
  background:var(--slate);border:1px solid rgba(200,40,42,.25);
  border-radius:20px;padding:52px 44px;width:min(90vw,380px);text-align:center;
}
.pin-logo{font-size:1.8rem;font-weight:700;color:var(--cream);margin-bottom:4px;}
.pin-sub{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:36px;}
.pin-display{font-size:2.4rem;letter-spacing:16px;height:56px;margin-bottom:24px;color:var(--cream);user-select:none;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.pin-btn{
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  border-radius:12px;padding:18px;font-size:1.3rem;font-family:var(--sans);
  color:var(--cream);cursor:pointer;transition:background .15s,border-color .15s;
}
.pin-btn:hover{background:rgba(200,40,42,.15);border-color:var(--red);}
.pin-btn.wide{grid-column:span 2;}
.pin-enter{
  background:var(--red);color:#fff;border:none;border-radius:12px;padding:18px;
  width:100%;font-size:1rem;font-weight:700;font-family:var(--sans);cursor:pointer;
  letter-spacing:.06em;transition:background .2s;
}
.pin-enter:hover{background:#a81f21;}
.pin-error{color:#f87171;font-size:.85rem;margin-top:12px;height:20px;}

/* ── APP LAYOUT ── */
#adminApp{display:none;height:100vh;flex-direction:row;overflow:hidden;}
.sidebar{
  width:220px;background:#110702;min-height:100vh;display:flex;
  flex-direction:column;flex-shrink:0;border-right:1px solid var(--border);
}
.sidebar-logo{padding:24px 20px 18px;border-bottom:1px solid var(--border);}
.sidebar-logo-name{font-size:1.1rem;font-weight:700;color:var(--cream);}
.sidebar-logo-sub{font-size:.64rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}
.sidebar-nav{padding:14px 10px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;
  border-radius:10px;font-size:.86rem;font-weight:500;color:var(--muted);
  cursor:pointer;transition:all .18s;margin-bottom:3px;
  border:none;background:none;width:100%;text-align:left;font-family:var(--sans);
}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--cream);}
.nav-item.active{background:rgba(200,40,42,.18);color:var(--red);font-weight:600;}
.nav-item .ni{font-size:.95rem;width:18px;text-align:center;flex-shrink:0;}
.sidebar-footer{padding:14px 10px;border-top:1px solid var(--border);}
.logout-btn{
  display:flex;align-items:center;gap:10px;padding:10px 13px;
  color:var(--dim);font-size:.8rem;cursor:pointer;border-radius:8px;
  transition:all .2s;border:none;background:none;font-family:var(--sans);width:100%;
}
.logout-btn:hover{background:rgba(255,255,255,.04);color:var(--muted);}

/* ── MAIN CONTENT ── */
.main-content{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.top-bar{
  background:var(--slate);border-bottom:1px solid var(--border);
  padding:0 28px;display:flex;align-items:center;justify-content:space-between;
  height:56px;flex-shrink:0;position:sticky;top:0;z-index:10;
}
.top-bar-title{font-size:1.1rem;font-weight:700;color:var(--cream);}
.top-bar-right{display:flex;align-items:center;gap:12px;}
.top-bar-date{font-size:.78rem;color:var(--muted);}
.content-body{padding:24px;flex:1;}

/* ── KPI CARDS ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi-card{
  background:var(--card);border:1px solid var(--border);border-top:3px solid var(--red);
  border-radius:14px;padding:18px;
}
.kpi-label{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
.kpi-val{font-size:2rem;font-weight:700;color:#fff;line-height:1;}
.kpi-sub{font-size:.72rem;color:var(--dim);margin-top:5px;}

/* ── GENERIC CARD ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.card-title{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:18px;}

/* ── BUTTONS ── */
.btn{
  border:none;border-radius:9px;padding:8px 16px;font-size:.8rem;font-weight:600;
  cursor:pointer;font-family:var(--sans);transition:all .18s;letter-spacing:.03em;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:#a81f21;}
.btn-dark{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid var(--border);}
.btn-dark:hover{background:rgba(255,255,255,.14);}
.btn-outline{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-outline:hover{border-color:var(--red);color:var(--red);}
.btn-sm{padding:5px 12px;font-size:.75rem;}
.btn-icon{padding:5px 8px;font-size:.75rem;}
.save-btn{background:var(--red);color:#fff;border:none;padding:12px 28px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:var(--sans);transition:background .2s;}
.save-btn:hover{background:#a81f21;}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{
  font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
}
td{
  padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.04);
  font-size:.85rem;color:rgba(255,255,255,.8);vertical-align:middle;
}
tr:last-child td{border-bottom:none;}
tr:nth-child(even) td{background:rgba(255,255,255,.015);}
tr:hover td{background:rgba(200,40,42,.05);}

/* ── STATUS BADGES ── */
.badge{
  display:inline-flex;align-items:center;padding:3px 9px;
  border-radius:20px;font-size:.68rem;font-weight:700;letter-spacing:.04em;white-space:nowrap;
}
.badge-new{background:rgba(200,40,42,.2);color:#fca5a5;}
.badge-making{background:rgba(245,158,11,.18);color:var(--amber);}
.badge-ready{background:rgba(16,185,129,.15);color:var(--green);}
.badge-completed,.badge-done{background:rgba(255,255,255,.08);color:var(--muted);}
.badge-doordash{background:rgba(200,40,42,.15);color:#fca5a5;}
.badge-pickup{background:rgba(59,130,246,.15);color:#93c5fd;}
.badge-whatsapp{background:rgba(16,185,129,.15);color:#6ee7b7;}

/* ── FILTER TABS ── */
.filter-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.filter-tab{
  padding:7px 16px;border-radius:50px;font-size:.8rem;font-weight:500;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--muted);
  font-family:var(--sans);transition:all .18s;
}
.filter-tab.active{background:var(--red);border-color:var(--red);color:#fff;}
.filter-tab:hover:not(.active){border-color:var(--red);color:var(--red);}

/* ── SEARCH BAR ── */
.search-bar{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:10px;padding:8px 14px;
}
.search-bar input{
  background:none;border:none;outline:none;color:var(--cream);
  font-family:var(--sans);font-size:.85rem;width:220px;
}
.search-bar input::placeholder{color:var(--dim);}
.search-bar span{color:var(--dim);font-size:.85rem;}

/* ── TOGGLE ── */
.toggle{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.15);border-radius:24px;transition:.3s;}
.toggle-slider:before{position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
.toggle input:checked + .toggle-slider{background:var(--red);}
.toggle input:checked + .toggle-slider:before{transform:translateX(18px);}

/* ── FORM ── */
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;}
.form-input{
  width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:9px;
  font-size:.88rem;font-family:var(--sans);color:#fff;background:rgba(255,255,255,.05);
  transition:border-color .2s;outline:none;
}
.form-input:focus{border-color:var(--red);}
.form-input::placeholder{color:var(--dim);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
textarea.form-input{resize:vertical;}

/* ── SETTINGS HOURS ── */
.hours-grid{display:grid;gap:8px;}
.hours-row{
  display:flex;align-items:center;gap:14px;padding:10px 14px;
  background:rgba(255,255,255,.03);border-radius:10px;
  border:1px solid var(--border);
}
.hours-day{font-size:.85rem;font-weight:600;color:var(--cream);width:90px;flex-shrink:0;}
.hours-inputs{display:flex;align-items:center;gap:8px;flex:1;}
.hours-time{
  background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:7px;
  padding:6px 10px;color:#fff;font-family:var(--sans);font-size:.82rem;
  outline:none;width:100px;
}
.hours-time:focus{border-color:var(--red);}
.hours-sep{color:var(--muted);font-size:.8rem;}
.hours-closed{font-size:.78rem;color:var(--muted);}

/* ── CHARTS ── */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px;}
.chart-title{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:16px;}
.chart-wrap{position:relative;height:200px;}
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.delivery-row{display:flex;gap:14px;margin-bottom:18px;}
.delivery-stat{
  flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:18px;text-align:center;
}
.delivery-stat-icon{font-size:1.5rem;margin-bottom:6px;}
.delivery-stat-label{font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.delivery-stat-val{font-size:1.8rem;font-weight:700;color:#fff;}
.delivery-stat-pct{font-size:.78rem;color:var(--muted);margin-top:3px;}

/* ── QUICK STATS ── */
.stat-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.stat-item:last-child{border-bottom:none;}
.stat-rank{font-size:1.2rem;font-weight:700;color:rgba(200,40,42,.4);width:26px;flex-shrink:0;}
.stat-name{font-size:.88rem;font-weight:500;color:var(--cream);}
.stat-count{font-size:.78rem;color:var(--muted);margin-left:auto;white-space:nowrap;}

/* ── MODAL ── */
#itemModal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:500;
  display:none;align-items:center;justify-content:center;padding:24px;
  backdrop-filter:blur(4px);
}
#itemModal.open{display:flex;}
.modal-box{
  background:#1e0f08;border:1px solid var(--border);border-radius:20px;
  padding:30px;max-width:460px;width:100%;
  animation:modalIn .26s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.modal-title{font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:22px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:28px;right:28px;background:var(--slate);color:var(--cream);
  padding:13px 20px;border-radius:12px;font-size:.85rem;font-weight:500;z-index:9999;
  border-left:3px solid var(--red);transform:translateY(80px);opacity:0;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
#toast.show{transform:translateY(0);opacity:1;}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .analytics-grid{grid-template-columns:1fr;}
}
@media(max-width:600px){
  .sidebar{display:none;}
  .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pinScreen">
  <div class="pin-box">
    <div class="pin-logo">🍕 Biza Pizza</div>
    <div class="pin-sub">Admin Portal</div>
    <div class="pin-display" id="pinDisplay">· · · ·</div>
    <div class="pin-grid">
      <button class="pin-btn" onclick="addPin('1')">1</button>
      <button class="pin-btn" onclick="addPin('2')">2</button>
      <button class="pin-btn" onclick="addPin('3')">3</button>
      <button class="pin-btn" onclick="addPin('4')">4</button>
      <button class="pin-btn" onclick="addPin('5')">5</button>
      <button class="pin-btn" onclick="addPin('6')">6</button>
      <button class="pin-btn" onclick="addPin('7')">7</button>
      <button class="pin-btn" onclick="addPin('8')">8</button>
      <button class="pin-btn" onclick="addPin('9')">9</button>
      <button class="pin-btn wide" onclick="clearPin()">Clear</button>
      <button class="pin-btn" onclick="addPin('0')">0</button>
    </div>
    <button class="pin-enter" onclick="checkPin()">ENTER →</button>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-name">Biza Pizza</div>
      <div class="sidebar-logo-sub">Admin Portal</div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" onclick="showView('dashboard')"><span class="ni">📊</span> Dashboard</button>
      <button class="nav-item" onclick="showView('orders')"><span class="ni">🧾</span> Orders</button>
      <button class="nav-item" onclick="showView('menu')"><span class="ni">🍕</span> Menu</button>
      <button class="nav-item" onclick="showView('analytics')"><span class="ni">📈</span> Analytics</button>
      <button class="nav-item" onclick="showView('settings')"><span class="ni">⚙️</span> Settings</button>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">← Log Out</button>
    </div>
  </aside>
  <div class="main-content">
    <div class="top-bar">
      <div class="top-bar-title" id="viewTitle">Dashboard</div>
      <div class="top-bar-right">
        <div class="top-bar-date" id="topBarDate"></div>
      </div>
    </div>
    <div class="content-body" id="contentBody"></div>
  </div>
</div>

<!-- ITEM MODAL (add / edit) -->
<div id="itemModal">
  <div class="modal-box">
    <div class="modal-title" id="itemModalTitle">Edit Item</div>
    <div class="form-group">
      <label class="form-label">Item Name</label>
      <input class="form-input" id="iName" type="text">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Price</label>
        <input class="form-input" id="iPrice" type="text" placeholder="$0.00">
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-input" id="iCategory">
          <option>Pizzas</option><option>Pastéis</option><option>Esfihas</option>
          <option>Porções</option><option>Combos</option><option>Drinks</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-input" id="iDesc" rows="3"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeItemModal()">Cancel</button>
      <button class="btn btn-red" onclick="saveItem()">Save →</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ════════════════════ PIN ════════════════════ */
let pin = '';
const ADMIN_PIN = '1234';

function addPin(d) {
  if (pin.length >= 4) return;
  pin += d;
  updatePinDisplay();
  if (pin.length === 4) setTimeout(checkPin, 120);
}
function clearPin() {
  pin = '';
  updatePinDisplay();
  document.getElementById('pinError').textContent = '';
}
function updatePinDisplay() {
  const dots = '●'.repeat(pin.length) + '·'.repeat(4 - pin.length);
  document.getElementById('pinDisplay').textContent = dots.split('').join(' ');
}
function checkPin() {
  if (pin === ADMIN_PIN) {
    document.getElementById('pinScreen').style.display = 'none';
    document.getElementById('adminApp').style.display = 'flex';
    document.getElementById('topBarDate').textContent =
      new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    showView('dashboard');
  } else {
    document.getElementById('pinError').textContent = 'Incorrect PIN. Try again.';
    pin = ''; updatePinDisplay();
  }
}
function logout() {
  document.getElementById('pinScreen').style.display = 'flex';
  document.getElementById('adminApp').style.display = 'none';
  pin = ''; updatePinDisplay();
  stopRefresh();
}
document.addEventListener('keydown', e => {
  if (document.getElementById('pinScreen').style.display === 'none') return;
  if (e.key >= '0' && e.key <= '9') addPin(e.key);
  if (e.key === 'Enter') checkPin();
  if (e.key === 'Backspace') { pin = pin.slice(0, -1); updatePinDisplay(); }
});

  { id:'pastel-frango',      name:'Pastel de Frango',      category:'Pastéis', price:'$9.49',  desc:'Shredded chicken with cream cheese. 2-pack.' },

  const items = [
    { name:'Pizza Frango Catupiry', price:39.59, method:'doordash' },
    { name:'Combo Família',         price:52.99, method:'doordash' },
    { name:'Esfihas de Carne',      price:21.69, method:'whatsapp' },

    { name:'Pastel de Camarão',     price:11.99, method:'pickup'   },
    { name:'Combo Eu',              price:28.49, method:'whatsapp' },
    { name:'Pizza Quatro Queijos',  price:39.59, method:'doordash' },
    { name:'Guaraná Antártica',     price:7.59,  method:'pickup'   },
    { name:'Pizza Margherita',      price:33.39, method:'doordash' },
    { name:'Frango Frito',          price:15.99, method:'pickup'   },
  ];
  const seed = [
    [2,1,0,3,1,2,0,3,1,0,2],
    [0,3,1,0,2,1,3,0,2,1,3,0,1],
    [3,0,2,1,0,3,1,2,0,1,2,3,0,1],
    [1,0,3,2,1,0,2,3,1,0],
    [0,2,1,3,0,1,2,3,0,2,1,3,0,2,1,3,0],
    [2,1,0,3,2,1,0,3,2,1,0,3,2,1,0,3,2,1,0,3,2],
    [0,3,2,1,0,3,2,1,0,3,2,1,0],
  ];
  const orders = [];
  const now = Date.now();
  let idNum = 2700;
  for (let d = 6; d >= 0; d--) {
    const dayBase = now - d * 86400000;
    const daySeed = seed[6 - d];
    daySeed.forEach((idx, i) => {
      const item = items[idx % items.length];
      const hour = 18 + (i % 5);
      const ts = new Date(dayBase);
      ts.setHours(hour, (i * 7) % 60, 0, 0);
      orders.push({
        id: '#' + (idNum++),
        timestamp: ts.getTime(),
        items: '1× ' + item.name,
        total: item.price.toFixed(2),
        method: item.method,
        status: 'completed'
      });
    });
  }
  return orders;
})();

/* ════════════════════ KPI CALC ════════════════════ */
function isToday(ts) {
  const d = new Date(ts), t = new Date();
  return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
}
function calcKPIs(orders) {
  const todayOrders = orders.filter(o => isToday(o.timestamp));
  const todayRevenue = todayOrders.reduce((s, o) => s + parseFloat(o.total || 0), 0);
  const avgValue = todayOrders.length ? todayRevenue / todayOrders.length : 0;
  const lsOrders = getLsOrders();
  const inQueue = lsOrders.filter(o => o.status === 'new' || o.status === 'making').length;
  return { todayCount: todayOrders.length, todayRevenue, avgValue, inQueue };
}

function countItems(orders) {
  const counts = {};
  orders.forEach(o => {
    String(o.items).split(',').forEach(it => {
      const name = it.trim().replace(/^\d+×\s*/,'').replace(/\s*\([^)]*\)$/,'').trim();
      if (name) counts[name] = (counts[name] || 0) + 1;
    });
  });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]);
}

function peakHour(orders) {
  const hours = {};
  orders.forEach(o => {
    const h = new Date(o.timestamp).getHours();
    hours[h] = (hours[h] || 0) + 1;
  });
  const peak = Object.entries(hours).sort((a,b) => b[1]-a[1])[0];
  if (!peak) return 'N/A';
  const h = parseInt(peak[0]);
  return `${h > 12 ? h - 12 : h}:00 ${h >= 12 ? 'PM' : 'AM'}`;
}

function setOrdersFilter(f) { ordersFilter = f; reRenderOrders(); }
function reRenderOrders() { document.getElementById('contentBody').innerHTML = renderOrders(); }

function updateOrderStatus(id, val) {
  if (!val) return;
  const orders = getLsOrders();
  const idx = orders.findIndex(o => o.id === id);
  if (val === '__delete') {
    if (idx > -1) { orders.splice(idx, 1); saveLsOrders(orders); }
    showToast('Order deleted');
  } else {
    if (idx > -1) { orders[idx].status = val; saveLsOrders(orders); }
    showToast(`Order ${id} → ${capitalize(val)}`);
  }
  reRenderOrders();
}

function exportCSV() {
  const orders = [...getLsOrders(), ...DEMO_ORDERS].sort((a,b) => b.timestamp - a.timestamp);
  const rows = [
    ['Order #','Items','Total','Method','Status','Time'],
    ...orders.map(o => [
      o.id, o.items, '$' + parseFloat(o.total||0).toFixed(2),
      methodLabel(o.method), o.status || 'completed', formatTime(o.timestamp)
    ])
  ];
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'biza-orders.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('Downloading orders.csv…');
}

    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      y: {
        beginAtZero: true,
        grid: { color: 'rgba(255,255,255,.06)' },
        ticks: { color: 'rgba(255,255,255,.38)', font: { size: 11 } },
        border: { display: false }
      },
      x: {
        grid: { display: false },
        ticks: { color: 'rgba(255,255,255,.38)', font: { size: 11 } },
        border: { display: false }
      }
    }
  };

  /* Revenue by day */
  const dayLabels = [], revByDay = [], volByDay = [];
  for (let d = 6; d >= 0; d--) {
    const date = new Date(Date.now() - d * 86400000);
    dayLabels.push(date.toLocaleDateString('en-US', { weekday:'short', month:'numeric', day:'numeric' }));
    const dayOrders = orders.filter(o => {
      const od = new Date(o.timestamp);
      return od.getDate()===date.getDate() && od.getMonth()===date.getMonth() && od.getFullYear()===date.getFullYear();
    });
    revByDay.push(dayOrders.reduce((s,o) => s + parseFloat(o.total||0), 0).toFixed(2));
    volByDay.push(dayOrders.length);
  }

  const c1 = document.getElementById('chartRevenue');
  const c4 = document.getElementById('chartVolume');
  if (c1) {
    activeCharts.push(new Chart(c1, {
      type:'bar',
      data: { labels: dayLabels, datasets: [{ data: revByDay, backgroundColor: 'rgba(200,40,42,.7)', borderRadius: 5, borderSkipped: false }] },
      options: { ...chartDefaults, plugins: { legend:{display:false}, tooltip:{callbacks:{label:ctx=>'$'+parseFloat(ctx.raw).toFixed(2)}} }, scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, ticks: { ...chartDefaults.scales.y.ticks, callback: v => '$'+v } } } }
    }));
  }
  if (c4) {
    activeCharts.push(new Chart(c4, {
      type:'bar',
      data: { labels: dayLabels, datasets: [{ data: volByDay, backgroundColor: 'rgba(245,158,11,.65)', borderRadius: 5 }] },
      options: chartDefaults
    }));
  }

  /* Orders by hour */
  const hourLabels = [], hourData = [];
  for (let h = 18; h <= 23; h++) {
    const cnt = orders.filter(o => new Date(o.timestamp).getHours() === h).length;
    hourLabels.push(`${h > 12 ? h-12 : h}${h >= 12 ? 'PM':'AM'}`);
    hourData.push(cnt);
  }
  const c2 = document.getElementById('chartHours');
  if (c2) {
    activeCharts.push(new Chart(c2, {
      type:'bar',
      data: { labels: hourLabels, datasets: [{ data: hourData, backgroundColor: 'rgba(59,130,246,.65)', borderRadius: 5 }] },
      options: chartDefaults
    }));
  }

  /* Top 5 items — horizontal bar */
  const topItems = countItems(orders).slice(0, 5);
  const c3 = document.getElementById('chartItems');
  if (c3 && topItems.length) {
    activeCharts.push(new Chart(c3, {
      type:'bar',
      data: {
        labels: topItems.map(([n]) => n.length > 22 ? n.slice(0,20)+'…' : n),
        datasets: [{ data: topItems.map(([,c]) => c), backgroundColor: 'rgba(16,185,129,.65)', borderRadius: 5 }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { beginAtZero:true, grid:{ color:'rgba(255,255,255,.06)' }, ticks:{ color:'rgba(255,255,255,.38)', font:{size:11} }, border:{display:false} },
          y: { grid:{ display:false }, ticks:{ color:'rgba(255,255,255,.6)', font:{size:11} }, border:{display:false} }
        }
      }
    }));
  }
}

/* ════════════════════ SETTINGS ════════════════════ */
function renderSettings() {
  const s = getSettings();
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const hoursHtml = days.map(d => {
    const h = s.hours[d] || { open:false, from:'18:30', to:'23:30' };
    return `
      <div class="hours-row">
        <span class="hours-day">${d}</span>
        <label class="toggle" style="flex-shrink:0">
          <input type="checkbox" class="hours-toggle" data-day="${d}" ${h.open?'checked':''}>
          <span class="toggle-slider"></span>
        </label>
        <div class="hours-inputs" id="hours-inputs-${d}" style="${h.open?'':'opacity:.35;pointer-events:none'}">
          <input class="hours-time" type="time" id="hours-from-${d}" value="${h.from}">
          <span class="hours-sep">–</span>
          <input class="hours-time" type="time" id="hours-to-${d}" value="${h.to}">
        </div>
        ${!h.open ? '<span class="hours-closed">Closed</span>' : ''}
      </div>`;
  }).join('');
  return `
    <div class="card">
      <div class="card-header"><div class="card-title">Restaurant Info</div></div>
      <div class="form-group"><label class="form-label">Restaurant Name</label>
        <input class="form-input" id="s-name" type="text" value="${s.name}"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Phone</label>
          <input class="form-input" id="s-phone" type="tel" value="${s.phone}"></div>
        <div class="form-group"><label class="form-label">WhatsApp Link</label>
          <input class="form-input" id="s-whatsapp" type="text" value="${s.whatsapp}"></div>
      </div>
      <div class="form-group"><label class="form-label">Address</label>
        <input class="form-input" id="s-address" type="text" value="${s.address}"></div>
      <div class="form-group"><label class="form-label">DoorDash Store URL</label>
        <input class="form-input" id="s-doordash" type="url" value="${s.doordash}"></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Hours of Operation</div></div>
      <div class="hours-grid">${hoursHtml}</div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <button class="save-btn" onclick="saveSettingsForm()">Save Settings</button>
      <span id="saveFeedback" style="color:var(--green);font-size:.85rem;font-weight:600;opacity:0;transition:opacity .4s"></span>
    </div>`;
}

function saveSettingsForm() {
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const hours = {};
  days.forEach(d => {
    const open = document.querySelector(`.hours-toggle[data-day="${d}"]`)?.checked ?? false;
    const from = document.getElementById(`hours-from-${d}`)?.value || '18:30';
    const to   = document.getElementById(`hours-to-${d}`)?.value || '23:30';
    hours[d] = { open, from, to };
  });
  const settings = {
    name:     document.getElementById('s-name')?.value     || '',
    phone:    document.getElementById('s-phone')?.value    || '',
    address:  document.getElementById('s-address')?.value  || '',
    doordash: document.getElementById('s-doordash')?.value || '',
    whatsapp: document.getElementById('s-whatsapp')?.value || '',
    hours
  };
  localStorage.setItem('biza_settings', JSON.stringify(settings));
  const fb = document.getElementById('saveFeedback');
  if (fb) { fb.textContent = '✓ Saved!'; fb.style.opacity = 1; setTimeout(() => fb.style.opacity = 0, 2500); }
  showToast('Settings saved!');
  // Re-attach toggle listeners
  document.querySelectorAll('.hours-toggle').forEach(t => {
    t.addEventListener('change', function() {
      const inputs = document.getElementById('hours-inputs-' + this.dataset.day);
      if (inputs) { inputs.style.opacity = this.checked ? '1' : '.35'; inputs.style.pointerEvents = this.checked ? '' : 'none'; }
    });
  });
}

/* ════════════════════ HELPERS ════════════════════ */
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function methodLabel(m) { return { doordash:'🚗 DoorDash', pickup:'📦 Pickup', whatsapp:'💬 WhatsApp' }[m] || '📦 Pickup'; }
function formatTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg || 'Done!';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
