<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Biza Pizza — Kitchen Display</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#C8282A;
  --dark:#0D0602;
  --cream:#F5EDD8;
  --slate:#1A0B06;
  --amber:#F59E0B;
  --green:#10B981;
  --blue:#3B82F6;
  --sans:'DM Sans',system-ui,sans-serif;
}
html,body{height:100%;background:var(--dark);color:var(--cream);font-family:var(--sans);overflow:hidden;}

/* ── PIN SCREEN ── */
#pinScreen{
  position:fixed;inset:0;background:var(--dark);display:flex;
  align-items:center;justify-content:center;z-index:999;
}
.pin-wrap{
  background:var(--slate);border:1px solid rgba(200,40,42,.3);
  border-radius:20px;padding:52px 44px;width:min(90vw,380px);text-align:center;
}
.pin-logo{font-size:1.8rem;font-weight:700;color:var(--cream);margin-bottom:4px;}
.pin-sub{
  font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(245,237,216,.35);margin-bottom:36px;
}
.pin-display{
  font-size:2.4rem;letter-spacing:16px;height:56px;margin-bottom:24px;
  color:var(--cream);user-select:none;
}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.pin-btn{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:18px;font-size:1.3rem;font-family:var(--sans);
  color:var(--cream);cursor:pointer;transition:background .15s,border-color .15s;
}
.pin-btn:hover{background:rgba(200,40,42,.15);border-color:var(--red);}
.pin-btn.wide{grid-column:span 2;}
.pin-enter{
  background:var(--red);color:#fff;border:none;border-radius:12px;
  padding:18px;width:100%;font-size:1rem;font-weight:700;
  font-family:var(--sans);cursor:pointer;letter-spacing:.06em;transition:background .2s;
}
.pin-enter:hover{background:#a81f21;}
.pin-error{color:#e74c3c;font-size:.85rem;margin-top:12px;height:20px;}

/* ── KITCHEN LAYOUT ── */
#kitchen{display:none;height:100vh;flex-direction:column;}

/* ── HEADER ── */
.kitch-header{
  background:var(--slate);border-bottom:2px solid var(--red);
  padding:0 22px;display:flex;align-items:center;gap:14px;
  height:60px;flex-shrink:0;
}
.kitch-brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.kitch-logo-img{
  width:34px;height:34px;border-radius:7px;
  object-fit:contain;background:#fff;padding:2px;flex-shrink:0;
}
.kitch-brand-name{font-weight:700;font-size:1rem;color:var(--cream);line-height:1.2;}
.kitch-brand-sub{
  font-size:.64rem;color:rgba(255,255,255,.32);
  letter-spacing:.1em;text-transform:uppercase;
}
.kitch-clock{
  font-size:1.55rem;font-weight:700;color:var(--cream);
  letter-spacing:.08em;font-variant-numeric:tabular-nums;
  margin:0 auto;
}
.kitch-controls{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.kitch-active-count{
  font-size:.78rem;font-weight:600;color:rgba(255,255,255,.4);
  white-space:nowrap;margin-right:4px;
}
.kitch-btn{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  border-radius:9px;padding:7px 13px;font-size:.78rem;font-weight:600;
  color:var(--cream);cursor:pointer;transition:all .18s;
  white-space:nowrap;font-family:var(--sans);line-height:1;
}
.kitch-btn:hover{background:rgba(255,255,255,.13);}
.kitch-btn.sound-off{color:rgba(255,255,255,.3);border-color:rgba(255,255,255,.07);}
.kitch-btn-red{
  background:rgba(200,40,42,.15);border-color:rgba(200,40,42,.3);color:#f87171;
}
.kitch-btn-red:hover{background:rgba(200,40,42,.25);}
.kitch-btn-green{
  background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.28);color:#6ee7b7;
}
.kitch-btn-green:hover{background:rgba(16,185,129,.22);}

/* ── BOARD ── */
.kitch-board{
  flex:1;display:grid;grid-template-columns:repeat(3,1fr);
  overflow:hidden;
}
.col{
  display:flex;flex-direction:column;
  border-right:1px solid rgba(255,255,255,.06);overflow:hidden;
}
.col:last-child{border-right:none;}

/* Column headers */
.col-header{
  padding:11px 16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.col-new   .col-header{border-top:3px solid var(--red);}
.col-making .col-header{border-top:3px solid var(--amber);}
.col-ready  .col-header{border-top:3px solid var(--green);}
.col-header-left{display:flex;align-items:center;gap:9px;}
.col-label{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
.col-new   .col-label{color:var(--red);}
.col-making .col-label{color:var(--amber);}
.col-ready  .col-label{color:var(--green);}
.col-badge{border-radius:50px;padding:2px 9px;font-size:.7rem;font-weight:700;}
.col-new   .col-badge{background:rgba(200,40,42,.22);color:var(--red);}
.col-making .col-badge{background:rgba(245,158,11,.2);color:var(--amber);}
.col-ready  .col-badge{background:rgba(16,185,129,.18);color:var(--green);}

.col-body{
  flex:1;overflow-y:auto;padding:10px;
  display:flex;flex-direction:column;gap:9px;
}
.col-body::-webkit-scrollbar{width:3px;}
.col-body::-webkit-scrollbar-track{background:transparent;}
.col-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

/* ── ORDER CARDS ── */
.order-card{
  background:#1A0B06;border:1px solid rgba(255,255,255,.09);
  border-radius:16px;padding:14px;
  animation:cardIn .38s cubic-bezier(.34,1.56,.64,1) both;
  transition:transform .2s,box-shadow .2s;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(-18px) scale(.96)}
  to{opacity:1;transform:none}
}
.order-card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.5);}
.col-new   .order-card{border-left:3px solid var(--red);}
.col-making .order-card{border-left:3px solid var(--amber);}
.col-ready  .order-card{border-left:3px solid var(--green);opacity:.88;}

.card-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:4px;
}
.order-num{font-size:1.35rem;font-weight:700;color:#fff;letter-spacing:.02em;}
.method-badge{
  font-size:.66rem;font-weight:700;border-radius:6px;
  padding:3px 8px;letter-spacing:.04em;white-space:nowrap;
}
.method-doordash{background:rgba(200,40,42,.22);color:#fca5a5;}
.method-pickup  {background:rgba(59,130,246,.2);color:#93c5fd;}
.method-whatsapp{background:rgba(16,185,129,.2);color:#6ee7b7;}

.order-time{
  font-size:.7rem;color:rgba(255,255,255,.32);margin-bottom:9px;
}
.order-items{
  display:flex;flex-direction:column;gap:2px;margin-bottom:9px;
}
.order-item-row{
  font-size:.83rem;color:rgba(255,255,255,.78);
  padding:3px 0;line-height:1.4;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.order-item-row:last-child{border-bottom:none;}

/* Timer bar */
.timer-wrap{
  height:4px;background:rgba(255,255,255,.08);
  border-radius:2px;margin-bottom:12px;overflow:hidden;
}
.timer-bar{
  height:100%;border-radius:2px;width:0%;
  transition:width .6s ease,background-color 1.2s ease;
}

/* Action buttons */
.order-action-btn{
  width:100%;border:none;border-radius:10px;padding:11px;
  font-size:.86rem;font-weight:700;cursor:pointer;
  font-family:var(--sans);letter-spacing:.04em;transition:all .18s;
}
.btn-start   {background:var(--red);color:#fff;}
.btn-start:hover   {background:#a81f21;transform:translateY(-1px);}
.btn-ready   {background:var(--amber);color:#1a0b00;}
.btn-ready:hover   {background:#d97706;transform:translateY(-1px);}
.btn-complete{
  background:rgba(16,185,129,.15);color:var(--green);
  border:1px solid rgba(16,185,129,.28);
}
.btn-complete:hover{background:rgba(16,185,129,.28);transform:translateY(-1px);}

/* Empty state */
.col-empty{
  text-align:center;padding:48px 20px;
  color:rgba(255,255,255,.14);font-size:.83rem;line-height:2;
}
.col-empty-icon{font-size:1.6rem;display:block;margin-bottom:6px;opacity:.4;}

/* ── ADD ORDER MODAL ── */
#addModal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  display:none;align-items:center;justify-content:center;
  z-index:900;backdrop-filter:blur(4px);
}
#addModal.open{display:flex;}
.modal-card{
  background:#1e0f08;border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:32px;width:min(90vw,460px);
  animation:modalIn .28s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.modal-title{
  font-size:1.15rem;font-weight:700;color:#fff;margin-bottom:22px;
}
.modal-field{margin-bottom:16px;}
.modal-label{
  font-size:.72rem;color:rgba(255,255,255,.4);letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:6px;display:block;
}
.modal-input,.modal-textarea,.modal-select{
  width:100%;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);border-radius:10px;
  padding:11px 13px;color:#fff;font-family:var(--sans);
  font-size:.88rem;outline:none;transition:border-color .2s;
  resize:none;
}
.modal-input:focus,.modal-textarea:focus,.modal-select:focus{
  border-color:var(--red);
}
.modal-input[readonly]{color:rgba(255,255,255,.35);cursor:default;}
.modal-select{cursor:pointer;}
.modal-select option{background:#1e0f08;}
.modal-btns{display:flex;gap:10px;margin-top:4px;}
.modal-cancel{
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.45);
  border:none;border-radius:10px;padding:13px 20px;
  font-size:.88rem;font-family:var(--sans);cursor:pointer;
  transition:background .18s;
}
.modal-cancel:hover{background:rgba(255,255,255,.12);}
.modal-submit{
  flex:1;background:var(--red);color:#fff;border:none;border-radius:10px;
  padding:13px;font-size:.88rem;font-weight:700;
  font-family:var(--sans);cursor:pointer;transition:background .18s;
}
.modal-submit:hover{background:#a81f21;}

/* ── NEW ORDER TOAST ── */
#newOrderToast{
  position:fixed;top:68px;left:50%;transform:translateX(-50%);
  background:var(--red);color:#fff;border-radius:12px;
  padding:10px 24px;font-size:.88rem;font-weight:700;letter-spacing:.04em;
  display:none;align-items:center;gap:8px;z-index:800;
  box-shadow:0 8px 32px rgba(200,40,42,.5);
  pointer-events:none;
}
#newOrderToast.show{
  display:flex;
  animation:toastIn .32s cubic-bezier(.34,1.56,.64,1);
}
@keyframes toastIn{
  from{opacity:0;transform:translateX(-50%) translateY(-14px)}
  to  {opacity:1;transform:translateX(-50%) translateY(0)}
}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pinScreen">
  <div class="pin-wrap">
    <div class="pin-logo">🍕 Biza Pizza</div>
    <div class="pin-sub">Kitchen Display · Staff Only</div>
    <div class="pin-display" id="pinDisplay">· · · ·</div>
    <div class="pin-grid">
      <button class="pin-btn" onclick="addPin('1')">1</button>
      <button class="pin-btn" onclick="addPin('2')">2</button>
      <button class="pin-btn" onclick="addPin('3')">3</button>
      <button class="pin-btn" onclick="addPin('4')">4</button>
      <button class="pin-btn" onclick="addPin('5')">5</button>
      <button class="pin-btn" onclick="addPin('6')">6</button>
      <button class="pin-btn" onclick="addPin('7')">7</button>
      <button class="pin-btn" onclick="addPin('8')">8</button>
      <button class="pin-btn" onclick="addPin('9')">9</button>
      <button class="pin-btn wide" onclick="clearPin()">Clear</button>
      <button class="pin-btn" onclick="addPin('0')">0</button>
    </div>
    <button class="pin-enter" onclick="checkPin()">ENTER →</button>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<!-- KITCHEN DISPLAY -->
<div id="kitchen">
  <header class="kitch-header">
    <div class="kitch-brand">
      <img class="kitch-logo-img"
        src="https://img.cdn4dd.com/p/fit=contain,width=200,height=200,format=auto,quality=95/media/restaurant/cover_square/e9466487-cae5-4354-85dc-85e14c85970f.03"
        alt="Biza Pizza">
      <div>
        <div class="kitch-brand-name">Biza Pizza</div>
        <div class="kitch-brand-sub">Kitchen Display</div>
      </div>
    </div>

    <div class="kitch-clock" id="kitchClock">00:00:00</div>

    <div class="kitch-controls">
      <span class="kitch-active-count" id="activeCount">0 active orders</span>
      <button class="kitch-btn" id="soundBtn" onclick="toggleSound()">🔔 Sound ON</button>
      <button class="kitch-btn kitch-btn-red" onclick="clearReady()">Clear Ready</button>
      <button class="kitch-btn kitch-btn-green" onclick="openAddModal()">+ Add Order</button>
    </div>
  </header>

  <div class="kitch-board">
    <div class="col col-new">
      <div class="col-header">
        <div class="col-header-left">
          <span class="col-label">New</span>
          <span class="col-badge" id="newCount">0</span>
        </div>
      </div>
      <div class="col-body" id="colNew"></div>
    </div>
    <div class="col col-making">
      <div class="col-header">
        <div class="col-header-left">
          <span class="col-label">Making</span>
          <span class="col-badge" id="makingCount">0</span>
        </div>
      </div>
      <div class="col-body" id="colMaking"></div>
    </div>
    <div class="col col-ready">
      <div class="col-header">
        <div class="col-header-left">
          <span class="col-label">Ready</span>
          <span class="col-badge" id="readyCount">0</span>
        </div>
      </div>
      <div class="col-body" id="colReady"></div>
    </div>
  </div>
</div>

<!-- ADD ORDER MODAL -->
<div id="addModal">
  <div class="modal-card">
    <div class="modal-title">Add Walk-in Order</div>
    <div class="modal-field">
      <label class="modal-label" for="modalOrderNum">Order Number</label>
      <input class="modal-input" id="modalOrderNum" type="text" readonly>
    </div>
    <div class="modal-field">
      <label class="modal-label" for="modalItems">Items (one per line or comma-separated)</label>
      <textarea class="modal-textarea" id="modalItems" rows="3"
        placeholder="1× Pizza Grande — Calabresa&#10;2× Guaraná Antártica"></textarea>
    </div>
    <div class="modal-field">
      <label class="modal-label" for="modalMethod">Delivery Method</label>
      <select class="modal-select" id="modalMethod">
        <option value="doordash">🚗 DoorDash Delivery</option>
        <option value="pickup">📦 Pickup</option>
        <option value="whatsapp">💬 WhatsApp</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="modal-submit" onclick="submitAddOrder()">Add Order →</button>
    </div>
  </div>
</div>

<!-- NEW ORDER TOAST -->
<div id="newOrderToast">🔔 New Order Received!</div>

<script>
/* ── PIN ── */
let pin = '';
const KITCHEN_PIN = '5678';

function addPin(d) {
  if (pin.length >= 4) return;
  pin += d;
  updatePinDisplay();
  if (pin.length === 4) setTimeout(checkPin, 120);
}
function clearPin() {
  pin = '';
  updatePinDisplay();
  document.getElementById('pinError').textContent = '';
}
function updatePinDisplay() {
  const dots = '●'.repeat(pin.length) + '·'.repeat(4 - pin.length);
  document.getElementById('pinDisplay').textContent = dots.split('').join(' ');
}
function checkPin() {
  if (pin === KITCHEN_PIN) {
    document.getElementById('pinScreen').style.display = 'none';
    const k = document.getElementById('kitchen');
    k.style.display = 'flex';
    initKitchen();
  } else {
    document.getElementById('pinError').textContent = 'Wrong PIN. Try again.';
    pin = '';
    updatePinDisplay();
  }
}
document.addEventListener('keydown', e => {
  if (document.getElementById('pinScreen').style.display === 'none') return;
  if (e.key >= '0' && e.key <= '9') addPin(e.key);
  if (e.key === 'Enter') checkPin();
  if (e.key === 'Backspace') { pin = pin.slice(0, -1); updatePinDisplay(); }
});

/* ── STATE ── */
let orders = [];
let soundEnabled = true;
let autoOrderId = 3000;
let lsSeenIds = new Set();
let toastTimer = null;

const DEMO_MENUS = [
  ['1× Pizza Grande — Frango Catupiry', '1× Guaraná Antártica'],
  ['2× Esfihas de Carne', '1× Coca-Cola'],
  ['1× Pizza Broto — Margherita', '1× Batata Frita'],
  ['1× Pizza Gigante — Calabresa', '2× Guaraná Antártica'],
  ['1× Combo Família', '1× Limonada Brasileira'],
  ['1× Pizza Grande — Quatro Queijos', '1× Pastel de Camarão'],
  ['3× Pastel de Frango', '1× Suco de Maracujá'],
  ['1× Pizza Grande — Portuguesa', '1× Frango Frito'],
  ['1× Combo Eu', '2× Esfihas de Carne'],
];
const DEMO_METHODS = ['doordash', 'pickup', 'whatsapp'];

/* ── SOUNDS ── */
function beep(freq, duration, delay, gain) {
  if (!soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g);
    g.connect(ctx.destination);
    osc.frequency.value = freq;
    g.gain.setValueAtTime(gain || 0.2, ctx.currentTime + (delay || 0));
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (delay || 0) + duration);
    osc.start(ctx.currentTime + (delay || 0));
    osc.stop(ctx.currentTime + (delay || 0) + duration + 0.01);
  } catch (e) {}
}
function playNewOrder() {
  beep(880, 0.1, 0,    0.22);
  beep(880, 0.1, 0.18, 0.22);
  beep(880, 0.1, 0.36, 0.22);
}
function playStartCooking() {
  beep(660, 0.2, 0, 0.28);
}
function playMarkReady() {
  beep(880,  0.15, 0,    0.25);
  beep(1100, 0.22, 0.18, 0.3);
}

/* ── HELPERS ── */
function timeAgo(ts) {
  const diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60) return `${diff}s ago`;
  const m = Math.floor(diff / 60);
  return `${m} min ago`;
}

function parseItems(val) {
  if (Array.isArray(val)) return val;
  if (!val) return ['Order details pending'];
  return String(val).split(',').map(s => s.trim()).filter(Boolean);
}

function methodLabel(m) {
  return { doordash:'🚗 DoorDash', pickup:'📦 Pickup', whatsapp:'💬 WhatsApp' }[m] || '📦 Pickup';
}

function timerColor(pct) {
  if (pct < 62.5) return 'var(--green)';
  if (pct < 87.5) return 'var(--amber)';
  return 'var(--red)';
}

/* ── RENDER BOARD ── */
function renderBoard() {
  const colMap = { new:'colNew', making:'colMaking', ready:'colReady' };
  const counts = { new:0, making:0, ready:0 };
  const MAX_MS = 20 * 60 * 1000;

  Object.values(colMap).forEach(id => document.getElementById(id).innerHTML = '');

  orders.forEach(order => {
    if (!colMap[order.status]) return;
    counts[order.status]++;
    const colEl = document.getElementById(colMap[order.status]);

    const elapsed = Date.now() - order.timestamp;
    const pct = Math.min(100, elapsed / MAX_MS * 100);
    const tColor = timerColor(pct);

    let actionBtn = '';
    if (order.status === 'new') {
      actionBtn = `<button class="order-action-btn btn-start" onclick="advanceOrder('${order.id}')">Start Cooking →</button>`;
    } else if (order.status === 'making') {
      actionBtn = `<button class="order-action-btn btn-ready" onclick="advanceOrder('${order.id}')">Mark Ready ✓</button>`;
    } else {
      actionBtn = `<button class="order-action-btn btn-complete" onclick="completeOrder('${order.id}')">Complete ✓</button>`;
    }

    const card = document.createElement('div');
    card.className = 'order-card';
    card.dataset.id = order.id;
    card.dataset.ts = order.timestamp;
    card.innerHTML = `
      <div class="card-top">
        <div class="order-num">${order.id}</div>
        <span class="method-badge method-${order.method}">${methodLabel(order.method)}</span>
      </div>
      <div class="order-time" data-ts="${order.timestamp}">Received ${timeAgo(order.timestamp)}</div>
      <div class="order-items">
        ${order.items.map(it => `<div class="order-item-row">${it}</div>`).join('')}
      </div>
      <div class="timer-wrap">
        <div class="timer-bar" style="width:${pct.toFixed(1)}%;background:${tColor}"></div>
      </div>
      ${actionBtn}
    `;
    colEl.appendChild(card);
  });

  /* Empty states */
  Object.values(colMap).forEach(colId => {
    const el = document.getElementById(colId);
    if (!el.children.length) {
      el.innerHTML = '<div class="col-empty"><span class="col-empty-icon">—</span>No orders</div>';
    }
  });

  /* Update counts */
  document.getElementById('newCount').textContent    = counts.new;
  document.getElementById('makingCount').textContent = counts.making;
  document.getElementById('readyCount').textContent  = counts.ready;
  const active = counts.new + counts.making + counts.ready;
  document.getElementById('activeCount').textContent =
    `${active} active order${active !== 1 ? 's' : ''}`;
}

/* ── ORDER ACTIONS ── */
function advanceOrder(id) {
  const order = orders.find(o => o.id === id);
  if (!order) return;
  if (order.status === 'new') {
    order.status = 'making';
    playStartCooking();
  } else if (order.status === 'making') {
    order.status = 'ready';
    playMarkReady();
  }
  renderBoard();
}

function completeOrder(id) {
  orders = orders.filter(o => o.id !== id);
  renderBoard();
}

function clearReady() {
  orders = orders.filter(o => o.status !== 'ready');
  renderBoard();
}

/* ── SOUND TOGGLE ── */
function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundEnabled ? '🔔 Sound ON' : '🔕 Sound OFF';
  btn.classList.toggle('sound-off', !soundEnabled);
}

/* ── CLOCK + LIVE UPDATES ── */
function updateClock() {
  const now = new Date();
  document.getElementById('kitchClock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0');
}

function updateTimestamps() {
  document.querySelectorAll('.order-time[data-ts]').forEach(el => {
    el.textContent = 'Received ' + timeAgo(parseInt(el.dataset.ts));
  });
}

function updateTimerBars() {
  const MAX_MS = 20 * 60 * 1000;
  document.querySelectorAll('.order-card[data-ts]').forEach(card => {
    const ts = parseInt(card.dataset.ts);
    const pct = Math.min(100, (Date.now() - ts) / MAX_MS * 100);
    const bar = card.querySelector('.timer-bar');
    if (bar) {
      bar.style.width = pct.toFixed(1) + '%';
      bar.style.backgroundColor = timerColor(pct);
    }
  });
}

/* ── LOCALSTORAGE POLL ── */
function pollLocalStorage() {
  const raw = JSON.parse(localStorage.getItem('biza_demo_orders') || '[]');
  let hasNew = false;
  raw.forEach(o => {
    if (!lsSeenIds.has(o.id)) {
      lsSeenIds.add(o.id);
      if (!orders.find(ex => ex.id === o.id)) {
        orders.unshift({
          id: o.id,
          status: 'new',
          timestamp: o.timestamp || Date.now(),
          items: parseItems(o.items),
          method: 'doordash',
          total: o.total
        });
        hasNew = true;
      }
    }
  });
  if (hasNew) {
    renderBoard();
    playNewOrder();
    showToast();
  }
}

/* ── TOAST ── */
function showToast() {
  const t = document.getElementById('newOrderToast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ── AUTO DEMO ── */
function addRandomOrder() {
  const items  = DEMO_MENUS[Math.floor(Math.random() * DEMO_MENUS.length)];
  const method = DEMO_METHODS[Math.floor(Math.random() * DEMO_METHODS.length)];
  const id = '#' + (autoOrderId++);
  orders.unshift({ id, status:'new', timestamp:Date.now(), items, method });
  renderBoard();
  playNewOrder();
  showToast();
}

/* ── MANUAL ADD MODAL ── */
function openAddModal() {
  document.getElementById('modalOrderNum').value = '#' + autoOrderId;
  document.getElementById('modalItems').value = '';
  document.getElementById('modalMethod').value = 'doordash';
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('modalItems').focus(), 100);
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
}
function submitAddOrder() {
  const id     = document.getElementById('modalOrderNum').value;
  const raw    = document.getElementById('modalItems').value.trim();
  const method = document.getElementById('modalMethod').value;
  if (!raw) { document.getElementById('modalItems').focus(); return; }
  const items = raw.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
  autoOrderId++;
  orders.unshift({ id, status:'new', timestamp:Date.now(), items, method });
  closeAddModal();
  renderBoard();
  playNewOrder();
  showToast();
}
document.getElementById('addModal').addEventListener('click', e => {
  if (e.target === document.getElementById('addModal')) closeAddModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('addModal').classList.contains('open')) {
    closeAddModal();
  }
});

/* ── SEED ON INIT ── */
function seedOrders() {
  const raw = JSON.parse(localStorage.getItem('biza_demo_orders') || '[]');
  raw.forEach(o => {
    lsSeenIds.add(o.id);
    orders.push({
      id: o.id,
      status: o.status || 'new',
      timestamp: o.timestamp || Date.now(),
      items: parseItems(o.items),
      method: 'doordash',
      total: o.total
    });
  });
  const existingIds = new Set(orders.map(o => o.id));
  const seedData = [
    { id:'#2841', status:'new',    timestamp:Date.now() - 8 * 60000,
      items:['1× Pizza Grande — Frango Catupiry', '1× Guaraná Antártica'], method:'doordash' },
    { id:'#2842', status:'making', timestamp:Date.now() - 14 * 60000,
      items:['2× Esfihas de Carne', '1× Coca-Cola'], method:'whatsapp' },
    { id:'#2843', status:'new',    timestamp:Date.now() - 2 * 60000,
      items:['1× Pizza Broto — Margherita', '1× Batata Frita'], method:'pickup' },
  ];
  seedData.forEach(s => {
    if (!existingIds.has(s.id)) {
      lsSeenIds.add(s.id);
      orders.push(s);
    }
  });
}

/* ── INIT ── */
function initKitchen() {
  seedOrders();
  renderBoard();
  updateClock();
  updateTimerBars();
  setInterval(updateClock,       1000);
  setInterval(updateTimestamps, 30000);
  setInterval(updateTimerBars,  10000);
  setInterval(addRandomOrder,   45000);
  setInterval(pollLocalStorage,  3000);
}
</script>
</body>
