<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Biza Pizza — Kitchen Display</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#C8282A;--dark:#120A06;--cream:#F5EDD8;--gold:#B8860B;
  --slate:#1C0E08;--making:#D97706;--ready:#16A34A;
  --sans:'DM Sans',system-ui,sans-serif;--serif:'DM Serif Display',Georgia,serif;
}
html,body{height:100%;background:var(--dark);color:var(--cream);font-family:var(--sans);overflow:hidden;}
/* ── PIN SCREEN ── */
#pinScreen{
  position:fixed;inset:0;background:var(--dark);display:flex;
  align-items:center;justify-content:center;z-index:999;
}
.pin-wrap{
  background:var(--slate);border:1px solid rgba(200,40,42,.3);
  border-radius:20px;padding:52px 44px;width:min(90vw,380px);text-align:center;
}
.pin-logo{
  font-family:var(--serif);font-size:2.2rem;color:var(--cream);margin-bottom:4px;
}
.pin-sub{
  font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(245,237,216,.35);margin-bottom:36px;
}
.pin-display{
  font-size:2.4rem;letter-spacing:16px;height:56px;margin-bottom:24px;
  color:var(--cream);user-select:none;
}
.pin-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;
}
.pin-btn{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:18px;font-size:1.3rem;
  font-family:var(--sans);color:var(--cream);cursor:pointer;
  transition:background .15s,border-color .15s;
}
.pin-btn:hover{background:rgba(200,40,42,.15);border-color:var(--red);}
.pin-btn.wide{grid-column:span 2;}
.pin-enter{
  background:var(--red);color:#fff;border:none;border-radius:12px;
  padding:18px;width:100%;font-size:1rem;font-weight:700;
  font-family:var(--sans);cursor:pointer;letter-spacing:.06em;
  transition:background .2s;
}
.pin-enter:hover{background:#a81f21;}
.pin-error{color:#e74c3c;font-size:.85rem;margin-top:12px;height:20px;}

/* ── KITCHEN MAIN ── */
#kitchen{display:none;height:100vh;flex-direction:column;}
/* HEADER */
.kitch-header{
  background:var(--slate);border-bottom:2px solid var(--red);
  padding:16px 28px;display:flex;align-items:center;gap:20px;flex-shrink:0;
}
.kitch-logo{
  font-family:var(--serif);font-size:1.6rem;color:var(--cream);
  display:flex;align-items:center;gap:10px;
}
.kitch-logo img{width:40px;height:40px;border-radius:8px;object-fit:contain;background:#fff;padding:3px;}
.kitch-clock{
  font-size:2rem;font-weight:700;color:var(--cream);letter-spacing:.04em;
  font-family:var(--sans);margin-left:auto;
}
.order-count-badge{
  background:var(--red);color:#fff;border-radius:50px;
  padding:6px 16px;font-size:.88rem;font-weight:700;letter-spacing:.04em;
  white-space:nowrap;
}
.new-order-flash{
  background:var(--red);color:#fff;border-radius:8px;
  padding:8px 16px;font-size:.9rem;font-weight:700;
  animation:flashIn .4s ease-out;display:none;align-items:center;gap:8px;
}
.new-order-flash.show{display:flex;}
@keyframes flashIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

/* ── BOARD ── */
.kitch-board{
  flex:1;display:grid;grid-template-columns:repeat(3,1fr);
  gap:0;overflow:hidden;
}
.col{
  display:flex;flex-direction:column;
  border-right:1px solid rgba(255,255,255,.07);
  overflow:hidden;
}
.col:last-child{border-right:none;}
.col-header{
  padding:14px 20px;font-size:.75rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
.col-header .col-count{
  background:rgba(255,255,255,.12);border-radius:20px;
  padding:2px 10px;font-size:.72rem;
}
.col.col-new .col-header{background:rgba(200,40,42,.18);color:var(--red);}
.col.col-making .col-header{background:rgba(217,119,6,.18);color:var(--making);}
.col.col-ready .col-header{background:rgba(22,163,74,.18);color:var(--ready);}
.col-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;}
.col-body::-webkit-scrollbar{width:4px;}
.col-body::-webkit-scrollbar-track{background:transparent;}
.col-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}

/* ── ORDER CARDS ── */
.order-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:16px;transition:transform .2s,box-shadow .2s;
  animation:cardIn .35s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.order-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35);}
.col-new .order-card{border-left:3px solid var(--red);}
.col-making .order-card{border-left:3px solid var(--making);}
.col-ready .order-card{border-left:3px solid var(--ready);opacity:.85;}
.order-num{font-family:var(--serif);font-size:1.5rem;color:#fff;margin-bottom:2px;}
.order-time{font-size:.75rem;color:rgba(255,255,255,.38);margin-bottom:12px;}
.order-items{margin-bottom:14px;}
.order-item-row{
  display:flex;align-items:baseline;gap:6px;font-size:.88rem;
  color:rgba(255,255,255,.75);margin-bottom:4px;
}
.order-qty{
  background:rgba(200,40,42,.25);color:var(--red);border-radius:4px;
  padding:1px 6px;font-size:.75rem;font-weight:700;flex-shrink:0;
}
.order-total{
  font-size:.8rem;color:rgba(255,255,255,.35);
  border-top:1px solid rgba(255,255,255,.07);padding-top:10px;margin-bottom:12px;
}
.order-action-btn{
  width:100%;border:none;border-radius:10px;padding:12px;
  font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;
  font-family:var(--sans);letter-spacing:.04em;
}
.btn-start{background:var(--red);color:#fff;}
.btn-start:hover{background:#a81f21;transform:translateY(-1px);}
.btn-done{background:var(--making);color:#fff;}
.btn-done:hover{background:#b45309;transform:translateY(-1px);}
.fade-out{animation:fadeOut 3s ease-out forwards;}
@keyframes fadeOut{0%{opacity:.85}80%{opacity:.4}100%{opacity:0;height:0;padding:0;margin:0;overflow:hidden}}

/* ── EMPTY STATE ── */
.col-empty{
  text-align:center;padding:40px 20px;
  color:rgba(255,255,255,.18);font-size:.85rem;
}
.col-empty span{display:block;font-size:2rem;margin-bottom:8px;}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pinScreen">
  <div class="pin-wrap">
    <div class="pin-logo">🍕 Biza Pizza</div>
    <div class="pin-sub">Kitchen Display</div>
    <div class="pin-display" id="pinDisplay">· · · ·</div>
    <div class="pin-grid">
      <button class="pin-btn" onclick="addPin('1')">1</button>
      <button class="pin-btn" onclick="addPin('2')">2</button>
      <button class="pin-btn" onclick="addPin('3')">3</button>
      <button class="pin-btn" onclick="addPin('4')">4</button>
      <button class="pin-btn" onclick="addPin('5')">5</button>
      <button class="pin-btn" onclick="addPin('6')">6</button>
      <button class="pin-btn" onclick="addPin('7')">7</button>
      <button class="pin-btn" onclick="addPin('8')">8</button>
      <button class="pin-btn" onclick="addPin('9')">9</button>
      <button class="pin-btn wide" onclick="clearPin()">Clear</button>
      <button class="pin-btn" onclick="addPin('0')">0</button>
    </div>
    <button class="pin-enter" onclick="checkPin()">ENTER →</button>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<!-- KITCHEN DISPLAY -->
<div id="kitchen">
  <header class="kitch-header">
    <div class="kitch-logo">
      <img src="https://img.cdn4dd.com/p/fit=contain,width=200,height=200,format=auto,quality=95/media/restaurant/cover_square/e9466487-cae5-4354-85dc-85e14c85970f.03" alt="Biza Pizza">
      Biza Pizza Kitchen
    </div>
    <div class="new-order-flash" id="newOrderFlash">🔔 New Order!</div>
    <div class="order-count-badge" id="orderCountBadge">0 Active Orders</div>
    <div class="kitch-clock" id="kitchClock">00:00:00</div>
  </header>
  <div class="kitch-board">
    <div class="col col-new">
      <div class="col-header">
        <span>New</span>
        <span class="col-count" id="newCount">0</span>
      </div>
      <div class="col-body" id="colNew"></div>
    </div>
    <div class="col col-making">
      <div class="col-header">
        <span>Making</span>
        <span class="col-count" id="makingCount">0</span>
      </div>
      <div class="col-body" id="colMaking"></div>
    </div>
    <div class="col col-ready">
      <div class="col-header">
        <span>Ready</span>
        <span class="col-count" id="readyCount">0</span>
      </div>
      <div class="col-body" id="colReady"></div>
    </div>
  </div>
</div>

<script>
/* ── PIN LOGIC ── */
let pin = '';
const KITCHEN_PIN = '5678';

function addPin(d) {
  if (pin.length < 4) { pin += d; updatePinDisplay(); }
}
function clearPin() {
  pin = '';
  updatePinDisplay();
  document.getElementById('pinError').textContent = '';
}
function updatePinDisplay() {
  const d = document.getElementById('pinDisplay');
  if (pin.length === 0) { d.textContent = '· · · ·'; return; }
  d.textContent = '● '.repeat(pin.length).trim() + (pin.length < 4 ? ' ' + '· '.repeat(4 - pin.length).trim() : '');
}
function checkPin() {
  if (pin === KITCHEN_PIN) {
    document.getElementById('pinScreen').style.display = 'none';
    const k = document.getElementById('kitchen');
    k.style.display = 'flex';
    initKitchen();
  } else {
    document.getElementById('pinError').textContent = 'Wrong PIN. Try again.';
    pin = ''; updatePinDisplay();
  }
}
document.addEventListener('keydown', e => {
  if (document.getElementById('pinScreen').style.display === 'none') return;
  if (e.key >= '0' && e.key <= '9') addPin(e.key);
  if (e.key === 'Enter') checkPin();
  if (e.key === 'Backspace') { pin = pin.slice(0, -1); updatePinDisplay(); }
});

/* ── KITCHEN DATA ── */
let orders = [];
const DEMO_ITEMS = [
  [{ name: 'Pizza Grande Frango', qty: 1, price: 39.59 }, { name: 'Guaraná Antártica', qty: 1, price: 7.59 }],
  [{ name: 'Esfiha Carne', qty: 2, price: 21.69 }],
  [{ name: 'Pizza Broto Margherita', qty: 1, price: 33.39 }, { name: 'Extra Cheese', qty: 1, price: 2.50 }],
  [{ name: 'Pizza Gigante Calabresa', qty: 1, price: 49.49 }, { name: 'Guaraná Antártica', qty: 2, price: 7.59 }],
  [{ name: 'Combo Eu', qty: 1, price: 28.49 }, { name: 'Esfiha Camarão', qty: 1, price: 26.99 }],
];
let autoOrderId = 2848;

function calcTotal(items) {
  return items.reduce((s, i) => s + i.qty * i.price, 0).toFixed(2);
}

function timeAgo(ts) {
  const diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60) return `${diff}s ago`;
  const m = Math.floor(diff / 60);
  return `${m} min ago`;
}

function seedOrders() {
  const lsOrders = JSON.parse(localStorage.getItem('biza_demo_orders') || '[]');
  const fromLS = lsOrders.map(o => ({
    id: o.id,
    status: o.status || 'new',
    timestamp: o.timestamp || Date.now(),
    items: o.items.map(i => ({ name: i.name, qty: 1, price: parseFloat(i.price) })),
  }));
  const seed = [
    { id: 2841, status: 'new',    timestamp: Date.now() - 8 * 60000, items: DEMO_ITEMS[0] },
    { id: 2842, status: 'making', timestamp: Date.now() - 4 * 60000, items: DEMO_ITEMS[1] },
    { id: 2843, status: 'new',    timestamp: Date.now() - 2 * 60000, items: DEMO_ITEMS[2] },
  ];
  const seenIds = new Set(fromLS.map(o => o.id));
  orders = [...fromLS, ...seed.filter(s => !seenIds.has(s.id))];
}

function renderBoard() {
  const cols = { new: 'colNew', making: 'colMaking', ready: 'colReady' };
  const counts = { new: 0, making: 0, ready: 0 };
  Object.values(cols).forEach(id => { document.getElementById(id).innerHTML = ''; });

  orders.forEach(order => {
    if (!counts.hasOwnProperty(order.status)) return;
    counts[order.status]++;
    const col = document.getElementById(cols[order.status]);
    const card = document.createElement('div');
    card.className = 'order-card';
    card.dataset.id = order.id;
    const itemsHTML = order.items.map(it =>
      `<div class="order-item-row"><span class="order-qty">${it.qty}x</span><span>${it.name}</span></div>`
    ).join('');
    const actionBtn = order.status === 'new'
      ? `<button class="order-action-btn btn-start" onclick="advanceOrder(${order.id})">▶ START</button>`
      : order.status === 'making'
      ? `<button class="order-action-btn btn-done" onclick="advanceOrder(${order.id})">✓ DONE</button>`
      : '';
    card.innerHTML = `
      <div class="order-num">#${order.id}</div>
      <div class="order-time" data-ts="${order.timestamp}">${timeAgo(order.timestamp)}</div>
      <div class="order-items">${itemsHTML}</div>
      <div class="order-total">Total $${calcTotal(order.items)}</div>
      ${actionBtn}
    `;
    col.appendChild(card);
  });

  document.getElementById('newCount').textContent = counts.new;
  document.getElementById('makingCount').textContent = counts.making;
  document.getElementById('readyCount').textContent = counts.ready;

  const active = counts.new + counts.making + counts.ready;
  document.getElementById('orderCountBadge').textContent = `${active} Active Order${active !== 1 ? 's' : ''}`;

  ['colNew', 'colMaking', 'colReady'].forEach(colId => {
    const el = document.getElementById(colId);
    if (!el.children.length) {
      el.innerHTML = '<div class="col-empty"><span>—</span>No orders</div>';
    }
  });
}

function advanceOrder(id) {
  const order = orders.find(o => o.id === id);
  if (!order) return;
  const next = { new: 'making', making: 'ready' };
  if (next[order.status]) {
    order.status = next[order.status];
    renderBoard();
    if (order.status === 'ready') {
      setTimeout(() => {
        const card = document.querySelector(`.order-card[data-id="${id}"]`);
        if (card) {
          card.classList.add('fade-out');
          setTimeout(() => {
            orders = orders.filter(o => o.id !== id);
            renderBoard();
          }, 3000);
        }
      }, 180 * 1000);
    }
  }
}

/* ── WEB AUDIO BEEP ── */
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
    osc1.frequency.setValueAtTime(880, ctx.currentTime);
    osc2.frequency.setValueAtTime(1320, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc1.start(); osc1.stop(ctx.currentTime + 0.12);
    osc2.start(ctx.currentTime + 0.12); osc2.stop(ctx.currentTime + 0.4);
  } catch (e) {}
}

/* ── AUTO NEW ORDERS ── */
function addRandomOrder() {
  const items = DEMO_ITEMS[Math.floor(Math.random() * DEMO_ITEMS.length)];
  orders.unshift({ id: autoOrderId++, status: 'new', timestamp: Date.now(), items });
  renderBoard();
  playBeep();
  const flash = document.getElementById('newOrderFlash');
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 2500);
}

/* ── CLOCK ── */
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('kitchClock').textContent = `${h}:${m}:${s}`;
  document.querySelectorAll('.order-time[data-ts]').forEach(el => {
    el.textContent = timeAgo(parseInt(el.dataset.ts));
  });
}

/* ── INIT ── */
function initKitchen() {
  seedOrders();
  renderBoard();
  setInterval(updateClock, 1000);
  updateClock();
  setInterval(addRandomOrder, 45000);
}
</script>
</body>
</html>
