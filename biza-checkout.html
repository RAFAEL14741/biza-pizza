<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Biza Pizzas</title>
<link rel="icon" href="https://img.cdn4dd.com/p/fit=contain,width=200,height=200,format=auto,quality=95/media/restaurant/cover_square/e9466487-cae5-4354-85dc-85e14c85970f.03">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* ── RESET & VARIABLES ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --red:#C8282A;
  --dark:#120A06;
  --cream:#F5EDD8;
  --gold:#B8860B;
  --slate:#1C0E08;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
html { font-size:16px; }
body { font-family:var(--sans); background:#120A06; color:#fff; min-height:100vh; }
img { display:block; max-width:100%; }
a { text-decoration:none; color:inherit; }
button { background:none; border:none; font-family:var(--sans); cursor:pointer; }

/* ── NAV ── */
#co-nav {
  position:sticky; top:0; z-index:100;
  background:rgba(18,10,6,.97); backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:0 48px; height:68px;
  display:flex; align-items:center; justify-content:space-between;
}
.co-nav-logo {
  display:flex; align-items:center; gap:12px;
  font-family:var(--serif); font-size:1.3rem; color:#fff;
}
.co-nav-logo img { width:38px; height:38px; border-radius:8px; object-fit:contain; background:#fff; padding:2px; }
.co-nav-back {
  font-size:.84rem; color:rgba(255,255,255,.5);
  font-weight:500; letter-spacing:.04em;
  display:flex; align-items:center; gap:6px;
  transition:color .2s; padding:8px 0;
}
.co-nav-back:hover { color:#fff; }

/* ── MAIN LAYOUT ── */
.co-main {
  max-width:1160px; margin:0 auto; padding:48px 48px 80px;
  display:grid; grid-template-columns:1fr 1.1fr; gap:40px; align-items:start;
}

/* ── PANELS ── */
.co-panel {
  background:#1C0E08; border:1px solid rgba(255,255,255,.1);
  border-radius:20px; padding:32px;
}
.co-panel-title {
  font-family:var(--serif); font-size:1.5rem; color:#fff;
  margin-bottom:24px; padding-bottom:18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

/* ── ORDER SUMMARY ITEMS ── */
.co-item {
  display:flex; align-items:center; gap:14px;
  padding:14px 0; border-bottom:1px solid rgba(255,255,255,.06);
}
.co-item:last-child { border-bottom:none; }
.co-item-img {
  width:40px; height:40px; border-radius:8px;
  object-fit:cover; flex-shrink:0;
  background:rgba(255,255,255,.06);
}
.co-item-info { flex:1; min-width:0; }
.co-item-name { font-size:.9rem; font-weight:600; color:#fff; line-height:1.3; }
.co-item-variant { font-size:.75rem; color:rgba(255,255,255,.4); margin-top:2px; }
.co-qty { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.co-qty-btn {
  width:26px; height:26px; border-radius:50%;
  background:rgba(255,255,255,.08); color:#fff;
  font-size:1rem; display:flex; align-items:center; justify-content:center;
  line-height:1; transition:background .18s;
}
.co-qty-btn:hover { background:var(--red); }
.co-qty-num { font-size:.88rem; font-weight:600; color:#fff; min-width:18px; text-align:center; }
.co-item-price { font-size:.9rem; font-weight:700; color:var(--red); flex-shrink:0; margin-left:4px; }

/* ── TOTALS ── */
.co-totals { margin-top:20px; padding-top:20px; border-top:1px solid rgba(255,255,255,.08); }
.co-subtotal-row, .co-delivery-row {
  display:flex; justify-content:space-between;
  font-size:.88rem; color:rgba(255,255,255,.5); margin-bottom:10px;
}
.co-delivery-label { font-style:italic; color:rgba(255,255,255,.3); }
.co-total-row {
  display:flex; justify-content:space-between;
  margin-top:16px; padding-top:16px;
  border-top:1px solid rgba(255,255,255,.1);
  font-size:1.5rem; font-weight:700; color:var(--red);
}

/* ── EMPTY STATE ── */
.co-empty { text-align:center; padding:48px 0; }
.co-empty-icon { font-size:3rem; margin-bottom:14px; }
.co-empty p { color:rgba(255,255,255,.4); font-size:.95rem; margin-bottom:20px; }
.co-back-btn {
  display:inline-block; color:var(--red); font-size:.88rem; font-weight:600;
  letter-spacing:.04em; border:1px solid var(--red); border-radius:999px;
  padding:9px 24px; transition:background .2s, color .2s;
}
.co-back-btn:hover { background:var(--red); color:#fff; }

/* ── FORM ── */
.form-group { margin-bottom:20px; }
.form-label {
  display:block; font-size:.7rem; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:rgba(255,255,255,.4); margin-bottom:8px;
}
.form-input {
  width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
  border-radius:12px; padding:13px 16px; color:#fff; font-family:var(--sans);
  font-size:.95rem; outline:none; transition:border-color .2s, box-shadow .2s;
}
.form-input:focus { border-color:var(--red); box-shadow:0 0 0 3px rgba(200,40,42,.18); }
.form-input::placeholder { color:rgba(255,255,255,.2); }
textarea.form-input { resize:vertical; min-height:80px; }

/* ── DELIVERY PILLS ── */
.delivery-pills { display:flex; gap:8px; }
.delivery-pill {
  flex:1; background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12); border-radius:999px;
  padding:10px 10px; color:rgba(255,255,255,.6); font-size:.76rem; font-weight:600;
  letter-spacing:.03em; transition:all .2s; text-align:center; font-family:var(--sans);
  white-space:nowrap;
}
.delivery-pill:hover { border-color:var(--red); color:#fff; }
.delivery-pill.active { background:var(--red); border-color:var(--red); color:#fff; }

/* ── ADDRESS WRAPPER ── */
#addressWrapper { overflow:hidden; height:0; opacity:0; }

/* ── PLACE ORDER BUTTON ── */
#placeOrderBtn {
  width:100%; background:var(--red); color:#fff; border:none; border-radius:12px;
  padding:16px; font-size:1rem; font-weight:700; margin-top:10px;
  box-shadow:0 8px 24px rgba(200,40,42,.35);
  transition:background .2s, transform .2s, opacity .2s, box-shadow .2s;
  font-family:var(--sans); letter-spacing:.03em;
}
#placeOrderBtn:hover:not(:disabled) { background:#a81f21; transform:translateY(-2px); box-shadow:0 12px 32px rgba(200,40,42,.45); }
#placeOrderBtn:disabled { opacity:.35; cursor:not-allowed; transform:none; box-shadow:none; }
.co-fine { font-size:.73rem; color:rgba(255,255,255,.22); text-align:center; margin-top:10px; }

/* ── CONFIRMATION ── */
#co-confirm { display:none; max-width:600px; margin:60px auto; padding:0 40px 80px; }
.confirm-card {
  background:#1C0E08; border:1px solid rgba(255,255,255,.1);
  border-radius:24px; padding:52px 40px; text-align:center;
}
.confirm-big-icon { font-size:4.5rem; margin-bottom:18px; }
.confirm-order-label {
  font-size:.75rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--red); margin-bottom:8px;
}
.confirm-title { font-family:var(--serif); font-size:2.4rem; color:#fff; margin-bottom:6px; }
.confirm-wait-badge {
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(200,40,42,.12); color:var(--red); border-radius:8px;
  padding:10px 20px; font-size:.9rem; font-weight:600; margin:18px 0 28px;
}
.confirm-items-box {
  background:rgba(255,255,255,.04); border-radius:14px; padding:20px 24px;
  margin-bottom:28px; text-align:left;
}
.confirm-item-line {
  display:flex; justify-content:space-between;
  color:rgba(255,255,255,.7); font-size:.88rem; padding:5px 0;
}
.confirm-item-line.total {
  border-top:1px solid rgba(255,255,255,.1); margin-top:10px;
  padding-top:14px; color:#fff; font-weight:700; font-size:.95rem;
}
.confirm-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.confirm-btn {
  padding:13px 28px; border-radius:12px; font-size:.9rem; font-weight:600;
  font-family:var(--sans); transition:all .2s; display:inline-block; letter-spacing:.03em;
}
.confirm-btn.primary { background:var(--red); color:#fff; border:none; box-shadow:0 4px 16px rgba(200,40,42,.35); }
.confirm-btn.primary:hover { background:#a81f21; transform:translateY(-1px); }
.confirm-btn.outline {
  background:transparent; color:rgba(255,255,255,.65);
  border:1px solid rgba(255,255,255,.18);
}
.confirm-btn.outline:hover { border-color:rgba(255,255,255,.45); color:#fff; }

/* ── RESPONSIVE ── */
@media(max-width:860px) {
  .co-main { grid-template-columns:1fr; padding:28px 20px 60px; gap:24px; }
  #co-nav { padding:0 20px; }
  .co-panel { padding:24px 20px; }
  #co-confirm { padding:0 20px 60px; margin-top:40px; }
  .confirm-card { padding:40px 24px; }
  .delivery-pills { flex-wrap:wrap; }
  .delivery-pill { min-width:calc(50% - 4px); }
}
@media(max-width:480px) {
  .co-nav-logo span { display:none; }
  .confirm-actions { flex-direction:column; }
  .confirm-btn { text-align:center; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav id="co-nav">
  <a href="index.html" class="co-nav-logo">
    <img src="https://img.cdn4dd.com/p/fit=contain,width=200,height=200,format=auto,quality=95/media/restaurant/cover_square/e9466487-cae5-4354-85dc-85e14c85970f.03" alt="Biza Pizza">
    <span>Biza Pizzas</span>
  </a>
  <a href="index.html" class="co-nav-back">← Back to Menu</a>
</nav>

<!-- CHECKOUT (two-column) -->
<main id="co-main-content">
  <div class="co-main">

    <!-- LEFT: ORDER SUMMARY -->
    <div class="co-panel">
      <h2 class="co-panel-title">Your Order</h2>
      <div id="co-item-list"></div>
      <div class="co-totals" id="co-totals" style="display:none">
        <div class="co-subtotal-row">
          <span>Subtotal</span>
          <span id="co-subtotal-val">$0.00</span>
        </div>
        <div class="co-delivery-row">
          <span>Delivery fee</span>
          <span class="co-delivery-label">Calculated at delivery</span>
        </div>
        <div class="co-total-row">
          <span>Total</span>
          <span id="co-total-val">$0.00</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: FORM -->
    <div class="co-panel">
      <h2 class="co-panel-title">Complete Your Order</h2>

      <div class="form-group">
        <label class="form-label" for="co-name">Name</label>
        <input class="form-input" id="co-name" type="text" placeholder="Your full name" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label" for="co-phone">Phone</label>
        <input class="form-input" id="co-phone" type="tel" placeholder="(215) 555-1234" autocomplete="tel">
      </div>
      <div class="form-group">
        <label class="form-label">How would you like to receive it?</label>
        <div class="delivery-pills">
          <button type="button" class="delivery-pill active" data-method="doordash">🚗 DoorDash Delivery</button>
          <button type="button" class="delivery-pill" data-method="pickup">📦 Pickup</button>
          <button type="button" class="delivery-pill" data-method="whatsapp">💬 WhatsApp</button>
        </div>
      </div>

      <!-- Address (shown for DoorDash only) -->
      <div id="addressWrapper">
        <div class="form-group">
          <label class="form-label" for="co-address">Delivery Address</label>
          <textarea class="form-input" id="co-address" rows="2" placeholder="123 Main St, Philadelphia PA 19111" autocomplete="street-address"></textarea>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="co-notes">Special Instructions <span style="opacity:.45;font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
        <textarea class="form-input" id="co-notes" placeholder="Any allergies or special requests?"></textarea>
      </div>

      <button id="placeOrderBtn" disabled>Place Order →</button>
      <p class="co-fine">Demo only — no real charge will be made</p>
    </div>

  </div>
</main>

<!-- CONFIRMATION (hidden until order placed) -->
<div id="co-confirm">
  <div class="confirm-card">
    <div class="confirm-big-icon">🍕</div>
    <div class="confirm-order-label" id="co-confirm-num">Order #0000</div>
    <h2 class="confirm-title">Order Placed!</h2>
    <div class="confirm-wait-badge">⏱ Estimated wait: 20–25 minutes</div>
    <div class="confirm-items-box" id="co-confirm-items"></div>
    <div class="confirm-actions">
      <a href="biza-kitchen.html" class="confirm-btn primary">Track in Kitchen →</a>
      <a href="index.html" class="confirm-btn outline">← Back to Menu</a>
    </div>
  </div>
</div>

<script>
/* ── CART STATE ── */
let cart = JSON.parse(localStorage.getItem('biza_cart') || '[]');
cart = cart.map(i => ({ ...i, id: String(i.id) }));

function saveCart() { localStorage.setItem('biza_cart', JSON.stringify(cart)); }
function cartTotal() { return cart.reduce((s, i) => s + i.price * i.qty, 0); }

function updateQty(id, delta) {
  const idx = cart.findIndex(i => i.id === id);
  if (idx === -1) return;
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  saveCart(); renderSummary(); validateForm();
}

/* ── RENDER SUMMARY ── */
function renderSummary() {
  const list = document.getElementById('co-item-list');
  const totals = document.getElementById('co-totals');

  if (cart.length === 0) {
    list.innerHTML = `
      <div class="co-empty">
        <div class="co-empty-icon">🛒</div>
        <p>Your cart is empty</p>
        <a href="index.html" class="co-back-btn">← Back to Menu</a>
      </div>`;
    totals.style.display = 'none';
    return;
  }

  const total = cartTotal();
  list.innerHTML = cart.map(item => `
    <div class="co-item">
      <img class="co-item-img" src="${item.img || ''}" alt="${item.name}" onerror="this.style.background='rgba(200,40,42,.15)'">
      <div class="co-item-info">
        <p class="co-item-name">${item.name}</p>
        ${item.variant ? `<p class="co-item-variant">${item.variant}</p>` : ''}
      </div>
      <div class="co-qty">
        <button class="co-qty-btn qty-dec" data-id="${item.id}">−</button>
        <span class="co-qty-num">${item.qty}</span>
        <button class="co-qty-btn qty-inc" data-id="${item.id}">+</button>
      </div>
      <span class="co-item-price">$${(item.price * item.qty).toFixed(2)}</span>
    </div>`).join('');

  list.querySelectorAll('.qty-dec').forEach(btn =>
    btn.addEventListener('click', () => updateQty(btn.dataset.id, -1)));
  list.querySelectorAll('.qty-inc').forEach(btn =>
    btn.addEventListener('click', () => updateQty(btn.dataset.id, 1)));

  document.getElementById('co-subtotal-val').textContent = '$' + total.toFixed(2);
  document.getElementById('co-total-val').textContent = '$' + total.toFixed(2);
  totals.style.display = 'block';
}

/* ── DELIVERY PILLS ── */
let selectedMethod = 'doordash';
const addressWrapper = document.getElementById('addressWrapper');

document.querySelectorAll('.delivery-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.delivery-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    selectedMethod = pill.dataset.method;
    if (selectedMethod === 'doordash') {
      gsap.to(addressWrapper, { height: 'auto', opacity: 1, duration: 0.35, ease: 'power2.out' });
    } else {
      gsap.to(addressWrapper, { height: 0, opacity: 0, duration: 0.25, ease: 'power2.in' });
    }
  });
});

/* ── FORM VALIDATION ── */
function validateForm() {
  const name = document.getElementById('co-name').value.trim();
  const phone = document.getElementById('co-phone').value.trim();
  const btn = document.getElementById('placeOrderBtn');
  btn.disabled = !(name && phone && cart.length > 0);
}
document.getElementById('co-name').addEventListener('input', validateForm);
document.getElementById('co-phone').addEventListener('input', validateForm);

/* ── PLACE ORDER ── */
document.getElementById('placeOrderBtn').addEventListener('click', () => {
  if (cart.length === 0) return;

  const orderNum = '#' + (Math.floor(Math.random() * 9000) + 1000);
  const total = cartTotal().toFixed(2);
  const itemsStr = cart.map(i =>
    i.qty + '× ' + i.name + (i.variant ? ' (' + i.variant + ')' : '')
  ).join(', ');

  // Save to localStorage
  const orders = JSON.parse(localStorage.getItem('biza_demo_orders') || '[]');
  orders.unshift({ id: orderNum, timestamp: Date.now(), items: itemsStr, total, method: selectedMethod, status: 'new' });
  localStorage.setItem('biza_demo_orders', JSON.stringify(orders));

  // Build confirmation HTML
  document.getElementById('co-confirm-num').textContent = 'Order ' + orderNum;
  document.getElementById('co-confirm-items').innerHTML =
    cart.map(item =>
      `<div class="confirm-item-line">
        <span>${item.qty}× ${item.name}${item.variant ? ' (' + item.variant + ')' : ''}</span>
        <span>$${(item.price * item.qty).toFixed(2)}</span>
      </div>`
    ).join('') +
    `<div class="confirm-item-line total"><span>Total</span><span>$${total}</span></div>`;

  // Clear cart
  cart = [];
  saveCart();

  // Animate to confirmation
  const main = document.getElementById('co-main-content');
  const confirm = document.getElementById('co-confirm');
  gsap.to(main, { opacity: 0, y: -24, duration: 0.3, ease: 'power2.in', onComplete: () => {
    main.style.display = 'none';
    confirm.style.display = 'block';
    gsap.fromTo(confirm, { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.55, ease: 'back.out(1.4)' });
  }});
});

/* ── INIT ── */
window.addEventListener('DOMContentLoaded', () => {
  // DoorDash is default — open address wrapper immediately
  gsap.set(addressWrapper, { height: 'auto', opacity: 1 });
  renderSummary();
  validateForm();
});
</script>

</body>
</html>
